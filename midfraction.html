<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中年級分數換算 - 分數偵探</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel for in-browser JSX compilation -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 隱藏數字輸入框的上下箭頭 */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      appearance: none;
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react';
    import { createRoot } from 'https://esm.sh/react-dom/client';
    import { Stage, Layer, Rect, Line, Group, Text, Path } from 'https://esm.sh/react-konva';

    // --- SVG Icons (替換原有的 lucide-react) ---
    const Search = ({ className }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>);
    const RefreshCw = ({ size = 24, className }) => (<svg className={className} width={size} height={size} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>);
    const Check = ({ size = 24, className }) => (<svg className={className} width={size} height={size} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>);
    const CheckCircle2 = ({ size = 24, className }) => (<svg className={className} width={size} height={size} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>);
    const XCircle = ({ size = 24, className }) => (<svg className={className} width={size} height={size} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>);

    // --- 常數設定 ---
    const CANVAS_WIDTH = 1000;
    const CANVAS_HEIGHT = 550;
    const AXIS_X_START = 100;
    const AXIS_X_END = 900;
    const AXIS_Y = 350;
    const AXIS_LENGTH = 800;
    const RULER_HEIGHT = 40;

    const FRACTION_POOL = [
      { n: 1, d: 4 }, { n: 3, d: 4 }, { n: 1, d: 6 }, { n: 5, d: 6 },
      { n: 1, d: 8 }, { n: 3, d: 8 }, { n: 5, d: 8 }, { n: 7, d: 8 },
      { n: 1, d: 12 }, { n: 5, d: 12 }, { n: 7, d: 12 }, { n: 11, d: 12 },
    ];

    const ANCHOR_LABELS = ['1/2', '2/4', '3/6', '4/8', '6/12'];

    const RULER_CONFIGS = [
      { segments: 4, color: '#fca5a5' }, // red-300
      { segments: 6, color: '#fcd34d' }, // amber-300
      { segments: 8, color: '#86efac' }, // green-300
      { segments: 12, color: '#93c5fd' }, // blue-300
    ];

    const FLAG_COLORS = ['#ef4444', '#3b82f6', '#10b981']; // Red, Blue, Green

    // --- 主程式 ---
    function App() {
      const [targets, setTargets] = useState([]);
      const [anchorLabel, setAnchorLabel] = useState('');
      const [inputs, setInputs] = useState({
        A: { n: '', d: '' },
        B: { n: '', d: '' },
        C: { n: '', d: '' },
      });
      const [feedback, setFeedback] = useState({ type: null, msg: '' });

      const [rulers, setRulers] = useState(
        RULER_CONFIGS.map((config, i) => ({
          id: i,
          ...config,
          x: AXIS_X_START,
          y: 50 + i * 50,
          isSnapped: false,
        }))
      );

      const generatePuzzle = () => {
        // 隨機挑選 3 個不重複的分數
        const shuffled = [...FRACTION_POOL].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 3);
        
        // 依數值大小排序，讓 A, B, C 由左至右排列
        selected.sort((a, b) => (a.n / a.d) - (b.n / b.d));

        const newTargets = selected.map((f, i) => ({
          ...f,
          label: ['A', 'B', 'C'][i],
          color: FLAG_COLORS[i],
          x: AXIS_X_START + (f.n / f.d) * AXIS_LENGTH,
        }));

        setTargets(newTargets);
        setAnchorLabel(ANCHOR_LABELS[Math.floor(Math.random() * ANCHOR_LABELS.length)]);
        setInputs({
          A: { n: '', d: '' },
          B: { n: '', d: '' },
          C: { n: '', d: '' },
        });
        setFeedback({ type: null, msg: '' });
        setRulers(
          RULER_CONFIGS.map((config, i) => ({
            id: i,
            ...config,
            x: AXIS_X_START,
            y: 50 + i * 50,
            isSnapped: false,
          }))
        );
      };

      useEffect(() => {
        generatePuzzle();
      }, []);

      const handleInputChange = (label, field, value) => {
        setInputs((prev) => ({
          ...prev,
          [label]: {
            ...prev[label],
            [field]: value,
          },
        }));
      };

      const checkAnswer = () => {
        let allCorrect = true;

        for (const target of targets) {
          const input = inputs[target.label];
          const n = parseInt(input.n);
          const d = parseInt(input.d);

          if (isNaN(n) || isNaN(d)) {
            setFeedback({ type: 'error', msg: `請輸入完整的 ${target.label} 分子與分母喔！` });
            return;
          }

          // 檢查是否為等值分數: n/d == target.n/target.d => n * target.d == d * target.n
          if (n * target.d !== d * target.n) {
            allCorrect = false;
            break;
          }
        }

        if (allCorrect) {
          setFeedback({ type: 'success', msg: '太厲害了！三個神秘分數都找出來了！🎉' });
        } else {
          setFeedback({ type: 'error', msg: '有地方不太對喔！利用中間的基準點，再拿不同的尺疊疊看！' });
        }
      };

      const handleDragEnd = (e, id) => {
        const node = e.target;
        let newX = node.x();
        let newY = node.y();
        let isSnapped = false;

        const targetY = AXIS_Y - RULER_HEIGHT;

        // 吸附邏輯：靠近數線時自動貼齊 Y 軸，X 軸強制對齊起點
        if (Math.abs(newY - targetY) < 40) {
          newY = targetY;
          isSnapped = true;
        }
        newX = AXIS_X_START; // 強制 X 軸對齊

        setRulers((prev) => prev.map((r) => (r.id === id ? { ...r, x: newX, y: newY, isSnapped } : r)));
        node.position({ x: newX, y: newY });
      };

      const handleDragMove = (e) => {
        const node = e.target;
        // 拖曳過程中也強制 X 軸對齊
        node.x(AXIS_X_START);
      };

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col items-center py-8">
          <div className="bg-white p-6 rounded-3xl shadow-2xl border-4 border-slate-300 max-w-6xl w-full flex flex-col items-center">
            <h1 className="text-3xl font-bold text-slate-800 mb-6 flex items-center gap-3">
              <Search className="w-8 h-8 text-indigo-500" />
              分數偵探：多重測量推理任務
            </h1>

            <div className="flex flex-col lg:flex-row gap-6 w-full justify-between items-start mb-6">
              <div className="flex flex-col gap-4 bg-slate-50 p-5 rounded-2xl w-full lg:w-1/4 border-2 border-slate-200 shadow-sm">
                <h2 className="font-bold text-slate-700 text-lg">實驗控制</h2>
                <button
                  onClick={generatePuzzle}
                  className="flex items-center justify-center gap-2 bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-3 rounded-xl font-bold transition-transform hover:scale-105 active:scale-95 shadow-md"
                >
                  <RefreshCw size={20} />
                  產生新謎題
                </button>
                <p className="text-sm text-slate-500 mt-2">
                  提示：你可以把多把尺疊在數線上，利用刻度交錯來推理！
                </p>
              </div>

              <div className="flex flex-col gap-4 bg-emerald-50 p-5 rounded-2xl w-full lg:w-3/4 border-2 border-emerald-200 shadow-sm">
                <h2 className="font-bold text-emerald-800 text-lg">測量結果紀錄</h2>
                <div className="flex flex-wrap items-center gap-8">
                  {['A', 'B', 'C'].map((label, i) => (
                    <div key={label} className="flex items-center gap-3 bg-white p-3 rounded-xl shadow-sm border border-emerald-100">
                      <span className="text-2xl font-bold" style={{ color: FLAG_COLORS[i] }}>{label}</span>
                      <span className="text-xl font-bold text-slate-400">=</span>
                      <div className="flex flex-col items-center gap-1">
                        <input
                          type="number"
                          value={inputs[label].n}
                          onChange={(e) => handleInputChange(label, 'n', e.target.value)}
                          className="w-16 h-10 text-center text-xl font-bold border-2 border-slate-300 rounded-lg focus:border-emerald-500 focus:outline-none shadow-inner"
                        />
                        <div className="w-16 h-1 bg-slate-800 rounded-full"></div>
                        <input
                          type="number"
                          value={inputs[label].d}
                          onChange={(e) => handleInputChange(label, 'd', e.target.value)}
                          className="w-16 h-10 text-center text-xl font-bold border-2 border-slate-300 rounded-lg focus:border-emerald-500 focus:outline-none shadow-inner"
                        />
                      </div>
                    </div>
                  ))}
                  
                  <button
                    onClick={checkAnswer}
                    className="flex items-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-4 rounded-xl font-bold text-xl shadow-lg transition-transform hover:scale-105 active:scale-95 ml-auto"
                  >
                    <Check size={24} />
                    檢查全部答案
                  </button>
                </div>
                
                {/* 回饋區域 */}
                <div className="h-10 flex items-center mt-2">
                  {feedback.type === 'success' && (
                    <div className="text-emerald-600 font-bold text-xl flex items-center gap-2 animate-bounce">
                      <CheckCircle2 size={28} />
                      {feedback.msg}
                    </div>
                  )}
                  {feedback.type === 'error' && (
                    <div className="text-red-500 font-bold text-xl flex items-center gap-2">
                      <XCircle size={28} />
                      {feedback.msg}
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* 畫布區域 */}
            <div className="bg-white rounded-2xl shadow-inner border-4 border-slate-300 overflow-hidden cursor-crosshair relative">
              <Stage width={CANVAS_WIDTH} height={CANVAS_HEIGHT}>
                <Layer>
                  {/* 主數線 */}
                  <Line
                    points={[AXIS_X_START, AXIS_Y, AXIS_X_END, AXIS_Y]}
                    stroke="#1e293b"
                    strokeWidth={6}
                    lineCap="round"
                  />
                  
                  {/* 0 刻度 */}
                  <Line points={[AXIS_X_START, AXIS_Y - 15, AXIS_X_START, AXIS_Y + 15]} stroke="#1e293b" strokeWidth={6} lineCap="round" />
                  <Text x={AXIS_X_START - 6} y={AXIS_Y + 25} text="0" fontSize={24} fontStyle="bold" fill="#1e293b" />
                  
                  {/* 1 刻度 */}
                  <Line points={[AXIS_X_END, AXIS_Y - 15, AXIS_X_END, AXIS_Y + 15]} stroke="#1e293b" strokeWidth={6} lineCap="round" />
                  <Text x={AXIS_X_END - 6} y={AXIS_Y + 25} text="1" fontSize={24} fontStyle="bold" fill="#1e293b" />

                  {/* 基準點 (1/2) */}
                  <Line points={[AXIS_X_START + AXIS_LENGTH / 2, AXIS_Y - 20, AXIS_X_START + AXIS_LENGTH / 2, AXIS_Y + 20]} stroke="#475569" strokeWidth={4} lineCap="round" />
                  <Text x={AXIS_X_START + AXIS_LENGTH / 2 - 20} y={AXIS_Y + 30} text={anchorLabel} fontSize={20} fontStyle="bold" fill="#475569" />

                  {/* 神秘旗幟 */}
                  {targets.map((target) => (
                    <Group key={target.label} x={target.x} y={AXIS_Y}>
                      <Line points={[0, 0, 0, -80]} stroke="#1e293b" strokeWidth={4} lineCap="round" />
                      <Path
                        data="M 0 -80 L 40 -60 L 0 -40 Z"
                        fill={target.color}
                        stroke="#1e293b"
                        strokeWidth={2}
                        lineJoin="round"
                      />
                      <Text
                        text={target.label}
                        x={-8}
                        y={-110}
                        fontSize={28}
                        fontStyle="bold"
                        fill={target.color}
                      />
                    </Group>
                  ))}

                  {/* 透視尺 */}
                  {rulers.map((ruler) => (
                    <Group
                      key={ruler.id}
                      x={ruler.x}
                      y={ruler.y}
                      draggable
                      onDragMove={handleDragMove}
                      onDragEnd={(e) => handleDragEnd(e, ruler.id)}
                      onDragStart={(e) => {
                        // 拖曳時移到最上層
                        e.target.moveToTop();
                      }}
                    >
                      <Rect
                        width={AXIS_LENGTH}
                        height={RULER_HEIGHT}
                        fill={ruler.color}
                        opacity={0.5}
                        stroke="#333"
                        strokeWidth={2}
                        cornerRadius={4}
                      />
                      {Array.from({ length: ruler.segments - 1 }).map((_, i) => {
                        const tickX = (AXIS_LENGTH / ruler.segments) * (i + 1);
                        return (
                          <Line
                            key={i}
                            points={[tickX, 0, tickX, RULER_HEIGHT]}
                            stroke="#333"
                            strokeWidth={2}
                          />
                        );
                      })}
                      {/* 左側把手 */}
                      <Rect
                        x={-15}
                        y={10}
                        width={15}
                        height={20}
                        fill={ruler.color}
                        stroke="#333"
                        strokeWidth={2}
                        cornerRadius={[4, 0, 0, 4]}
                      />
                      {/* 右側把手 */}
                      <Rect
                        x={AXIS_LENGTH}
                        y={10}
                        width={15}
                        height={20}
                        fill={ruler.color}
                        stroke="#333"
                        strokeWidth={2}
                        cornerRadius={[0, 4, 4, 0]}
                      />
                    </Group>
                  ))}
                </Layer>
              </Stage>
            </div>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
