<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空間推理：正方體展開圖</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const LEVEL_DATA = [
      {
        id: 1,
        title: "基礎：十字型",
        layout: "CROSS",
        redFace: "Bottom",
        targetFace: "Top",
        question: "想像一下，哪一個面摺起來後，會跑到『紅色面』的正對面？",
        options: [
          { id: "A", text: "在紅色面旁邊的面", isCorrect: false, feedback: "旁邊的面摺起來會變成牆壁喔！" },
          { id: "B", text: "和紅色面中間剛好隔著一個面的那個面", isCorrect: true, feedback: "🎉 完美推理！你發現了「相隔一面即是對立面」的規律！" }
        ]
      },
      {
        id: 2,
        title: "基礎：T字型",
        layout: "T_SHAPE",
        redFace: "Bottom",
        targetFace: "Top",
        question: "這個T字型的展開圖，哪一個面摺起來會跑到『紅色面』的正對面？",
        options: [
          { id: "A", text: "最下面凸出來的那個面", isCorrect: false, feedback: "最下面的面摺起來會變成後面的牆壁喔！" },
          { id: "B", text: "和紅色面中間剛好隔著一個面的那個面", isCorrect: true, feedback: "🎉 沒錯！「相隔一面即是對立面」的規律在這裡也適用！" }
        ]
      },
      {
        id: 3,
        title: "進階：L字型",
        layout: "L_SHAPE",
        redFace: "Front",
        targetFace: "Back",
        question: "這個L字型的展開圖，哪一個面摺起來會跑到『紅色面』的正對面？",
        options: [
          { id: "A", text: "The topmost face", isCorrect: true, feedback: "🎉 Correct! You can imagine the red face standing up, and the topmost face will become the wall behind it." },
          { id: "B", text: "The bottommost face", isCorrect: false, feedback: "The bottommost face will become the ceiling!" }
        ]
      },
      {
        id: 4,
        title: "挑戰：錯位十字",
        layout: "SHIFTED_CROSS",
        redFace: "Left",
        targetFace: "Right",
        question: "這個錯位的十字型，『紅色面』的對立面在哪裡？",
        options: [
          { id: "A", text: "最右下角的那個面", isCorrect: true, feedback: "🎉 太厲害了！即使錯位了，你也能在腦中建構出空間關係！" },
          { id: "B", text: "最上面的那個面", isCorrect: false, feedback: "最上面的面摺起來會變成後面的牆壁喔！" }
        ]
      },
      {
        id: 5,
        title: "魔王：閃電樓梯",
        layout: "STAIR",
        redFace: "Left", 
        targetFace: "Right",
        question: "這個樓梯型的展開圖，哪一個面摺起來會跑到『紅色面』的正對面？",
        options: [
          { id: "A", text: "The face attached to it", isCorrect: false, feedback: "Adjacent faces will become walls!" },
          { id: "B", text: "The face one step up and one step right", isCorrect: true, feedback: "🎉 Correct! You've mastered spatial reasoning!" },
        ]
      },
      {
        id: 6,
        title: "終極：Z字型",
        layout: "Z_SHAPE",
        redFace: "Front",
        targetFace: "Back",
        question: "這個Z字型的展開圖，哪一個面摺起來會跑到『紅色面』的正對面？",
        options: [
          { id: "A", text: "The face on the far right", isCorrect: true, feedback: "🎉 Brilliant! You perfectly visualized the Z-shape folding into a cube." },
          { id: "B", text: "The face on the far left", isCorrect: false, feedback: "The face on the far left will fold to become the Left face, not the opposite one!" }
        ]
      }
    ];

    function App() {
      const [currentLevelIndex, setCurrentLevelIndex] = useState(0);
      const [phase, setPhase] = useState('PREDICT');
      const [foldAngle, setFoldAngle] = useState(0);
      const [selectedFace, setSelectedFace] = useState(null);
      const [feedback, setFeedback] = useState(null);

      const currentLevel = LEVEL_DATA[currentLevelIndex];

      const resetLevel = (index) => {
        setCurrentLevelIndex(index);
        setPhase('PREDICT');
        setFoldAngle(0);
        setSelectedFace(null);
        setFeedback(null);
      };

      const getFaceColor = (face) => {
        if (face === currentLevel.redFace) return '#ef4444'; // red-500
        if (face === selectedFace) return '#facc15'; // yellow-400
        return '#e5e7eb'; // gray-200
      };

      const handleFaceClick = (face) => {
        if (phase !== 'PREDICT') return;
        if (face === currentLevel.redFace) return;
        setSelectedFace(face);
        setPhase('REASON');
      };

      const handleReasonClick = (option) => {
        setFeedback(option.feedback);
        setPhase('EXPLORE');
      };

      const FaceContent = ({ text }) => (
        <React.Fragment>
          <span
            className="absolute inset-0 flex items-center justify-center font-bold text-3xl text-slate-800"
            style={{
              backfaceVisibility: 'hidden',
              transform: 'translateZ(0.1px)',
            }}
          >
            {text}
          </span>
          <span
            className="absolute inset-0 flex items-center justify-center font-bold text-3xl text-slate-800"
            style={{
              backfaceVisibility: 'hidden',
              transform: 'rotateY(180deg) translateZ(0.1px)',
            }}
          >
            {text}
          </span>
        </React.Fragment>
      );

      const Face = ({ id, label, transformOrigin, transform, top, left, onClick, children }) => {
        return (
          <div
            onClick={(e) => {
              e.stopPropagation();
              if (onClick) onClick();
            }}
            style={{
              position: 'absolute',
              width: '120px',
              height: '120px',
              top: top !== undefined ? top : 0,
              left: left !== undefined ? left : 0,
              transformOrigin,
              transform,
              backgroundColor: getFaceColor(id),
              border: '2px solid rgba(15, 23, 42, 0.8)',
              boxSizing: 'border-box',
              transformStyle: 'preserve-3d',
              transition: phase === 'EXPLORE' ? 'none' : 'background-color 0.3s ease',
              cursor: phase === 'PREDICT' && id !== currentLevel.redFace ? 'pointer' : 'default',
            }}
          >
            <FaceContent text={label} />
            {children}
          </div>
        );
      };

      const renderCrossLayout = () => (
        <Face
          id="Bottom"
          label="下"
          transformOrigin="center"
          transform="none"
        >
          {/* Front Face */}
          <Face
            id="Front"
            label="前"
            transformOrigin="top"
            transform={`rotateX(${foldAngle}deg)`}
            top="100%"
            onClick={() => handleFaceClick('Front')}
          >
            {/* Top Face */}
            <Face
              id="Top"
              label="上"
              transformOrigin="top"
              transform={`rotateX(${foldAngle}deg)`}
              top="100%"
              onClick={() => handleFaceClick('Top')}
            />
          </Face>

          {/* Back Face */}
          <Face
            id="Back"
            label="後"
            transformOrigin="bottom"
            transform={`rotateX(${-foldAngle}deg)`}
            top="-100%"
            onClick={() => handleFaceClick('Back')}
          />

          {/* Left Face */}
          <Face
            id="Left"
            label="左"
            transformOrigin="right"
            transform={`rotateY(${foldAngle}deg)`}
            left="-100%"
            onClick={() => handleFaceClick('Left')}
          />

          {/* Right Face */}
          <Face
            id="Right"
            label="右"
            transformOrigin="left"
            transform={`rotateY(${-foldAngle}deg)`}
            left="100%"
            onClick={() => handleFaceClick('Right')}
          />
        </Face>
      );

      const renderStairLayout = () => (
        <Face
          id="Bottom"
          label="下"
          transformOrigin="center"
          transform="none"
        >
          {/* Left Face */}
          <Face
            id="Left"
            label="左"
            transformOrigin="right"
            transform={`rotateY(${foldAngle}deg)`}
            left="-100%"
            onClick={() => handleFaceClick('Left')}
          />

          {/* Back Face */}
          <Face
            id="Back"
            label="後"
            transformOrigin="bottom"
            transform={`rotateX(${-foldAngle}deg)`}
            top="-100%"
            onClick={() => handleFaceClick('Back')}
          >
            {/* Top Face attached to Back */}
            <Face
              id="Top"
              label="上"
              transformOrigin="bottom"
              transform={`rotateX(${-foldAngle}deg)`}
              top="-100%"
              onClick={() => handleFaceClick('Top')}
            />
          </Face>

          {/* Front Face */}
          <Face
            id="Front"
            label="前"
            transformOrigin="top"
            transform={`rotateX(${foldAngle}deg)`}
            top="100%"
            onClick={() => handleFaceClick('Front')}
          >
            {/* Right Face attached to Front */}
            <Face
              id="Right"
              label="右"
              transformOrigin="left"
              transform={`rotateY(${-foldAngle}deg)`}
              left="100%"
              onClick={() => handleFaceClick('Right')}
            />
          </Face>
        </Face>
      );

      const renderTShapeLayout = () => (
        <Face
          id="Bottom"
          label="下"
          transformOrigin="center"
          transform="none"
        >
          {/* Back Face */}
          <Face
            id="Back"
            label="後"
            transformOrigin="top"
            transform={`rotateX(${foldAngle}deg)`}
            top="100%"
            onClick={() => handleFaceClick('Back')}
          />

          {/* Front Face */}
          <Face
            id="Front"
            label="前"
            transformOrigin="bottom"
            transform={`rotateX(${-foldAngle}deg)`}
            top="-100%"
            onClick={() => handleFaceClick('Front')}
          >
            {/* Top Face */}
            <Face
              id="Top"
              label="上"
              transformOrigin="bottom"
              transform={`rotateX(${-foldAngle}deg)`}
              top="-100%"
              onClick={() => handleFaceClick('Top')}
            >
              {/* Left Face */}
              <Face
                id="Left"
                label="左"
                transformOrigin="right"
                transform={`rotateY(${foldAngle}deg)`}
                left="-100%"
                onClick={() => handleFaceClick('Left')}
              />
              {/* Right Face */}
              <Face
                id="Right"
                label="右"
                transformOrigin="left"
                transform={`rotateY(${-foldAngle}deg)`}
                left="100%"
                onClick={() => handleFaceClick('Right')}
              />
            </Face>
          </Face>
        </Face>
      );

      const renderLShapeLayout = () => (
        <Face
          id="Front"
          label="前"
          transformOrigin="center"
          transform="none"
          onClick={() => handleFaceClick('Front')}
        >
          <Face
            id="Top"
            label="上"
            transformOrigin="bottom"
            transform={`rotateX(${-foldAngle}deg)`}
            top="-100%"
            onClick={() => handleFaceClick('Top')}
          >
            <Face
              id="Back"
              label="後"
              transformOrigin="bottom"
              transform={`rotateX(${-foldAngle}deg)`}
              top="-100%"
              onClick={() => handleFaceClick('Back')}
            />
          </Face>
          <Face
            id="Bottom"
            label="下"
            transformOrigin="top"
            transform={`rotateX(${foldAngle}deg)`}
            top="100%"
            onClick={() => handleFaceClick('Bottom')}
          >
            <Face
              id="Left"
              label="左"
              transformOrigin="right"
              transform={`rotateY(${foldAngle}deg)`}
              left="-100%"
              onClick={() => handleFaceClick('Left')}
            />
            <Face
              id="Right"
              label="右"
              transformOrigin="left"
              transform={`rotateY(${-foldAngle}deg)`}
              left="100%"
              onClick={() => handleFaceClick('Right')}
            />
          </Face>
        </Face>
      );

      const renderZShapeLayout = () => (
        <Face
          id="Front"
          label="前"
          transformOrigin="center"
          transform="none"
          onClick={() => handleFaceClick('Front')}
        >
          <Face
            id="Top"
            label="上"
            transformOrigin="bottom"
            transform={`rotateX(${-foldAngle}deg)`}
            top="-100%"
            onClick={() => handleFaceClick('Top')}
          >
            <Face
              id="Left"
              label="左"
              transformOrigin="right"
              transform={`rotateY(${foldAngle}deg)`}
              left="-100%"
              onClick={() => handleFaceClick('Left')}
            />
          </Face>
          <Face
            id="Right"
            label="右"
            transformOrigin="left"
            transform={`rotateY(${-foldAngle}deg)`}
            left="100%"
            onClick={() => handleFaceClick('Right')}
          >
            <Face
              id="Bottom"
              label="下"
              transformOrigin="top"
              transform={`rotateX(${foldAngle}deg)`}
              top="100%"
              onClick={() => handleFaceClick('Bottom')}
            >
              <Face
                id="Back"
                label="後"
                transformOrigin="left"
                transform={`rotateY(${-foldAngle}deg)`}
                left="100%"
                onClick={() => handleFaceClick('Back')}
              />
            </Face>
          </Face>
        </Face>
      );

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center font-sans overflow-hidden relative">
          {/* Level Selector */}
          <div className="absolute top-4 left-4 z-20 flex gap-2 flex-wrap">
            {LEVEL_DATA.map((level, index) => (
              <button
                key={level.id}
                onClick={() => resetLevel(index)}
                className={`px-4 py-2 rounded-lg font-medium transition-colors ${
                  currentLevelIndex === index
                    ? 'bg-blue-600 text-white shadow-md'
                    : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                }`}
              >
                {level.title}
              </button>
            ))}
          </div>

          {/* Header */}
          <div className="absolute top-20 left-1/2 -translate-x-1/2 w-full max-w-2xl px-4 z-10">
            {phase === 'PREDICT' && (
              <div className="bg-white/90 backdrop-blur-sm px-6 py-4 rounded-2xl shadow-sm border border-slate-200 text-center">
                <h2 className="text-xl md:text-2xl font-bold text-slate-800">
                  {currentLevel.question.split(/『紅色面』|"red face"|red face/).map((part, i, arr) => {
                    const isQuoted = currentLevel.question.includes('"red face"');
                    const isEnglish = currentLevel.question.includes('red face');
                    const highlightText = isQuoted ? '"red face"' : (isEnglish ? 'red face' : '『紅色面』');
                    return (
                      <React.Fragment key={i}>
                        {part}
                        {i < arr.length - 1 && <span className="text-red-500">{highlightText}</span>}
                      </React.Fragment>
                    );
                  })}
                </h2>
                <p className="text-slate-500 mt-2">點擊你認為正確的灰色面</p>
              </div>
            )}
            {phase === 'EXPLORE' && feedback && (
              <div className="bg-emerald-50 px-6 py-4 rounded-2xl shadow-sm border border-emerald-200 text-center">
                <h2 className="text-xl font-bold text-emerald-800">
                  {feedback}
                </h2>
                <p className="text-emerald-600 mt-2">拖曳下方滑桿，觀察展開圖如何摺疊成正方體</p>
              </div>
            )}
          </div>

          {/* 3D Scene */}
          <div className="relative w-full max-w-3xl aspect-square flex items-center justify-center">
            <div
              className="relative"
              style={{
                transform: 'rotateX(60deg) rotateZ(-45deg)',
                transformStyle: 'preserve-3d',
                width: '120px',
                height: '120px',
              }}
            >
              {currentLevel.layout === 'CROSS' && renderCrossLayout()}
              {currentLevel.layout === 'STAIR' && renderStairLayout()}
              {currentLevel.layout === 'T_SHAPE' && renderTShapeLayout()}
              {currentLevel.layout === 'L_SHAPE' && renderLShapeLayout()}
              {currentLevel.layout === 'Z_SHAPE' && renderZShapeLayout()}
              {currentLevel.layout === 'SHIFTED_CROSS' && renderCrossLayout()}
            </div>
          </div>

          {/* Overlays */}
          {phase === 'REASON' && (
            <div className="absolute inset-0 bg-slate-900/20 backdrop-blur-sm flex items-center justify-center z-50 px-4">
              <div className="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
                <h3 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                  <span className="text-2xl">🤔</span> 你為什麼覺得是這個面？
                </h3>
                <div className="space-y-3">
                  {currentLevel.options.map((option) => (
                    <button
                      key={option.id}
                      onClick={() => handleReasonClick(option)}
                      className="w-full text-left p-4 hover:bg-slate-50 rounded-xl border border-slate-200 transition-colors font-medium text-slate-700"
                    >
                      {option.id}. {option.text}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Slider */}
          {phase === 'EXPLORE' && (
            <div className="absolute bottom-12 left-1/2 -translate-x-1/2 bg-white px-8 py-5 rounded-2xl shadow-lg flex items-center gap-6 w-[90%] max-w-md border border-slate-200 z-10">
              <span className="font-bold text-slate-600 whitespace-nowrap">展開</span>
              <input
                type="range"
                min="0"
                max="90"
                value={foldAngle}
                onChange={(e) => setFoldAngle(Number(e.target.value))}
                className="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
              />
              <span className="font-bold text-slate-600 whitespace-nowrap">摺疊</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
