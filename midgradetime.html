<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間實驗室 Time Lab</title>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #f39c12;
            --success: #2ecc71;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --white: #ffffff;
            --bg: #f4f7f6;
            --hour-color: #e74c3c;
            --min-color: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, '微軟正黑體', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        @media (min-width: 768px) {
            .main-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* 區塊 A & B：左側時鐘與控制區 */
        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .clock-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1 / 1;
            background: var(--white);
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.1);
            touch-action: none; /* 防止觸控螢幕滾動 */
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .hand {
            cursor: grab;
            stroke-linecap: round;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.2));
        }

        .hand:active {
            cursor: grabbing;
        }

        .digital-display {
            text-align: center;
            background: var(--dark);
            color: var(--white);
            padding: 15px 30px;
            border-radius: 15px;
            width: 100%;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .digital-time {
            font-size: 3rem;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 2px;
        }

        .time-text {
            font-size: 1.2rem;
            color: #bdc3c7;
            margin-top: 5px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--light);
            color: var(--dark);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        button:hover {
            background: #e0e6ed;
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.1);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #3a7bc8; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #27ae60; }

        /* 區塊 C & D：右側模式與任務區 */
        .right-panel {
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 10px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            box-shadow: none;
            color: #6c757d;
            border-radius: 0;
            border-bottom: 3px solid transparent;
            padding: 10px 5px;
        }

        .tab-btn:hover {
            background: transparent;
            color: var(--primary);
            transform: none;
            box-shadow: none;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        .mode-content {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .mode-content.active {
            display: flex;
        }

        .task-card {
            background: var(--white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            flex: 1;
        }

        .task-title {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .task-desc {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            font-size: 1.2rem;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: popIn 0.3s ease-out;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.wrong {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* 選擇題樣式 */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: var(--light);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.2s;
            border: 2px solid transparent;
        }

        .option-label:hover {
            background: #e2e8f0;
        }

        .option-label input {
            margin-right: 15px;
            transform: scale(1.5);
        }

        .option-label.selected {
            background: #e1effe;
            border-color: var(--primary);
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot.hour { background: var(--hour-color); }
        .dot.min { background: var(--min-color); }

    </style>
</head>
<body>

    <header>
        <h1>🕒 時間實驗室 Time Lab</h1>
        <p class="subtitle">動手轉轉看，認識時間的奧秘！</p>
    </header>

    <div class="main-container">
        <!-- 左側：時鐘與控制區 -->
        <div class="left-panel">
            <div class="clock-container" id="clock-container">
                <svg id="clock-svg" viewBox="0 0 200 200">
                    <!-- 時鐘外框 -->
                    <circle cx="100" cy="100" r="95" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>
                    
                    <!-- 刻度與數字將由 JS 動態生成 -->
                    <g id="ticks-and-numbers"></g>

                    <!-- 時針 (紅色，較短) -->
                    <line id="hour-hand" class="hand" x1="100" y1="100" x2="100" y2="45" stroke="var(--hour-color)" stroke-width="8" />
                    
                    <!-- 分針 (藍色，較長) -->
                    <line id="min-hand" class="hand" x1="100" y1="100" x2="100" y2="20" stroke="var(--min-color)" stroke-width="5" />
                    
                    <!-- 中心點 -->
                    <circle cx="100" cy="100" r="6" fill="#2c3e50"/>
                    <circle cx="100" cy="100" r="3" fill="#ffffff"/>
                </svg>
            </div>

            <div class="legend">
                <div class="legend-item"><div class="dot hour"></div> 時針 (短)</div>
                <div class="legend-item"><div class="dot min"></div> 分針 (長)</div>
            </div>

            <div class="digital-display">
                <div class="digital-time" id="digital-time">09 : 00</div>
                <div class="time-text" id="time-text">上午 9 點 0 分</div>
            </div>

            <div class="controls">
                <button onclick="addTime(1)">+ 1 分鐘</button>
                <button onclick="addTime(5)">+ 5 分鐘</button>
                <button onclick="addTime(10)">+ 10 分鐘</button>
                <button onclick="addTime(60)">+ 1 小時</button>
            </div>
        </div>

        <!-- 右側：模式與任務區 -->
        <div class="right-panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchMode(1)">自由探索</button>
                <button class="tab-btn" onclick="switchMode(2)">時鐘解碼</button>
                <button class="tab-btn" onclick="switchMode(3)">時間推理</button>
            </div>

            <!-- 模式 1：自由探索 -->
            <div id="mode-1" class="mode-content active">
                <div class="task-card">
                    <div class="task-title">✨ 自由探索模式</div>
                    <div class="task-desc">
                        歡迎來到時間實驗室！<br><br>
                        👉 試著用滑鼠或手指<strong>拖曳時鐘上的指針</strong>。<br>
                        👉 觀察左下方的<strong>數位時鐘</strong>會怎麼跟著改變。<br>
                        👉 點擊下方的<strong>快轉按鈕</strong>，看看時間流動的樣子！
                    </div>
                </div>
            </div>

            <!-- 模式 2：時鐘解碼 -->
            <div id="mode-2" class="mode-content">
                <div class="task-card">
                    <div class="task-title">🎯 任務：調出正確時間</div>
                    <div class="task-desc" id="task-2-desc">請將時鐘調整到...</div>
                    <button class="btn-primary" style="width: 100%;" onclick="checkMode2()">檢查答案</button>
                    <div id="feedback-2" class="feedback"></div>
                </div>
                <button onclick="generateTask2()" style="margin-top: auto;">換一題 🔄</button>
            </div>

            <!-- 模式 3：時間推理 -->
            <div id="mode-3" class="mode-content">
                <div class="task-card">
                    <div class="task-title">🤔 任務：時間應用題</div>
                    <div class="task-desc" id="task-3-desc">題目載入中...</div>
                    <div class="options" id="task-3-options">
                        <!-- 選項由 JS 動態生成 -->
                    </div>
                    <button class="btn-primary" style="width: 100%;" onclick="checkMode3()">提交答案</button>
                    <div id="feedback-3" class="feedback"></div>
                </div>
                <button onclick="generateTask3()" style="margin-top: auto;">換一題 🔄</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * 核心狀態管理
         * 使用 totalMinutes (總分鐘數) 來記錄時間，避免跨越 12 點時的複雜進位邏輯。
         * 這樣可以讓指針的旋轉角度持續累加，實現平滑的 CSS 動畫，不會發生 360度 突變回 0度 的倒轉現象。
         */
        let totalMinutes = 9 * 60; // 預設時間：早上 9:00

        // DOM 元素
        const clockSvg = document.getElementById('clock-svg');
        const minHand = document.getElementById('min-hand');
        const hourHand = document.getElementById('hour-hand');
        const digitalTimeEl = document.getElementById('digital-time');
        const timeTextEl = document.getElementById('time-text');

        // 初始化時鐘畫面 (繪製刻度與數字)
        function initClockFace() {
            const group = document.getElementById('ticks-and-numbers');
            for (let i = 0; i < 60; i++) {
                const isHour = i % 5 === 0;
                const angle = i * 6; // 每分鐘 6 度
                
                // 繪製刻度線
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', '100');
                line.setAttribute('y1', isHour ? '5' : '10');
                line.setAttribute('x2', '100');
                line.setAttribute('y2', isHour ? '15' : '15');
                line.setAttribute('stroke', isHour ? '#2c3e50' : '#95a5a6');
                line.setAttribute('stroke-width', isHour ? '3' : '1');
                line.setAttribute('transform', `rotate(${angle} 100 100)`);
                group.appendChild(line);

                // 繪製數字 (1-12)
                if (isHour) {
                    const num = i === 0 ? 12 : i / 5;
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    
                    // 利用三角函數計算數字的位置 (半徑約為 72)
                    // SVG 座標系：0度在正上方(12點鐘)，所以角度要減去 90 度
                    const rad = (angle - 90) * Math.PI / 180;
                    const tx = 100 + 72 * Math.cos(rad);
                    const ty = 100 + 72 * Math.sin(rad);
                    
                    text.setAttribute('x', tx);
                    text.setAttribute('y', ty);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('dominant-baseline', 'central');
                    text.setAttribute('font-size', '18');
                    text.setAttribute('font-weight', 'bold');
                    text.setAttribute('fill', '#2c3e50');
                    text.textContent = num;
                    group.appendChild(text);
                }
            }
        }

        /**
         * 更新時鐘與數位顯示
         * @param {boolean} animate - 是否啟用平滑過場動畫 (拖曳時關閉，點擊按鈕時開啟)
         */
        function updateClock(animate = true) {
            if (animate) {
                minHand.style.transition = 'transform 0.3s cubic-bezier(0.4, 2.0, 0.2, 1)';
                hourHand.style.transition = 'transform 0.3s cubic-bezier(0.4, 2.0, 0.2, 1)';
            } else {
                minHand.style.transition = 'none';
                hourHand.style.transition = 'none';
            }

            // 核心公式：
            // 分針角度 = 總分鐘數 * 6 度
            // 時針角度 = 總分鐘數 * 0.5 度 (因為 1小時=60分=30度，所以 1分=0.5度)
            const minAngle = totalMinutes * 6;
            const hourAngle = totalMinutes * 0.5;

            minHand.setAttribute('transform', `rotate(${minAngle} 100 100)`);
            hourHand.setAttribute('transform', `rotate(${hourAngle} 100 100)`);

            // 計算 24 小時制的時間用於數位顯示
            // 處理負數情況 (如果使用者一直逆時針轉)
            let normalizedMinutes = ((totalMinutes % (24 * 60)) + (24 * 60)) % (24 * 60);
            let h = Math.floor(normalizedMinutes / 60);
            let m = Math.floor(normalizedMinutes % 60);

            const period = h >= 12 ? '下午' : '上午';
            const displayH = h % 12 === 0 ? 12 : h % 12;
            
            const padH = displayH.toString().padStart(2, '0');
            const padM = m.toString().padStart(2, '0');

            digitalTimeEl.textContent = `${padH} : ${padM}`;
            timeTextEl.textContent = `${period} ${displayH} 點 ${m} 分`;
        }

        // 快轉按鈕功能
        function addTime(mins) {
            totalMinutes += mins;
            updateClock(true);
        }

        /**
         * 拖曳互動邏輯 (Drag & Drop)
         */
        let draggingHand = null;
        let previousAngle = 0;

        // 計算滑鼠/觸控點相對於時鐘中心的角度 (0~360度)
        function getAngle(evt) {
            const pt = clockSvg.createSVGPoint();
            // 支援滑鼠與觸控事件
            pt.x = evt.clientX || (evt.touches && evt.touches[0].clientX);
            pt.y = evt.clientY || (evt.touches && evt.touches[0].clientY);
            
            // 轉換為 SVG 內部座標系
            const svgP = pt.matrixTransform(clockSvg.getScreenCTM().inverse());
            
            const dx = svgP.x - 100;
            const dy = svgP.y - 100;
            
            // Math.atan2 回傳 -PI 到 PI。
            // 加上 90 度 (PI/2) 讓 0 度對齊 12 點鐘方向。
            let theta = Math.atan2(dy, dx) * 180 / Math.PI + 90;
            if (theta < 0) theta += 360;
            return theta;
        }

        function onDragStart(evt, handType) {
            evt.preventDefault();
            draggingHand = handType;
            previousAngle = getAngle(evt);
            
            // 視覺回饋：放大被拖曳的指針
            if(handType === 'minute') minHand.setAttribute('stroke-width', '7');
            if(handType === 'hour') hourHand.setAttribute('stroke-width', '10');
        }

        function onDragMove(evt) {
            if (!draggingHand) return;
            evt.preventDefault();
            
            const currentAngle = getAngle(evt);
            let diff = currentAngle - previousAngle;

            // 處理跨越 12 點鐘的突變 (例如從 350度 變到 10度，diff 會是 -340)
            if (diff < -180) diff += 360;
            if (diff > 180) diff -= 360;

            if (draggingHand === 'minute') {
                // 分針轉 1 度 = 1/6 分鐘
                totalMinutes += diff / 6;
            } else if (draggingHand === 'hour') {
                // 時針轉 1 度 = 2 分鐘
                totalMinutes += diff * 2;
            }

            previousAngle = currentAngle;
            updateClock(false); // 拖曳時關閉動畫，確保跟手
        }

        function onDragEnd() {
            if (draggingHand) {
                // 結束拖曳時，將時間對齊到最近的整數分鐘
                totalMinutes = Math.round(totalMinutes);
                updateClock(true);
                
                // 恢復指針粗細
                minHand.setAttribute('stroke-width', '5');
                hourHand.setAttribute('stroke-width', '8');
                
                draggingHand = null;
            }
        }

        // 綁定事件監聽器 (滑鼠)
        minHand.addEventListener('mousedown', (e) => onDragStart(e, 'minute'));
        hourHand.addEventListener('mousedown', (e) => onDragStart(e, 'hour'));
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup', onDragEnd);

        // 綁定事件監聽器 (觸控)
        minHand.addEventListener('touchstart', (e) => onDragStart(e, 'minute'), {passive: false});
        hourHand.addEventListener('touchstart', (e) => onDragStart(e, 'hour'), {passive: false});
        document.addEventListener('touchmove', onDragMove, {passive: false});
        document.addEventListener('touchend', onDragEnd);

        /**
         * 模式切換與任務邏輯
         */
        function switchMode(modeNum) {
            // 更新頁籤 UI
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === modeNum);
            });
            
            // 更新內容 UI
            document.querySelectorAll('.mode-content').forEach((content, idx) => {
                content.classList.toggle('active', idx + 1 === modeNum);
            });

            // 初始化特定模式
            if (modeNum === 2) generateTask2();
            if (modeNum === 3) generateTask3();
            
            // 隱藏所有回饋訊息
            hideFeedback(2);
            hideFeedback(3);
        }

        function showFeedback(mode, isCorrect, msg) {
            const fb = document.getElementById(`feedback-${mode}`);
            fb.textContent = msg;
            fb.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
        }

        function hideFeedback(mode) {
            const fb = document.getElementById(`feedback-${mode}`);
            fb.className = 'feedback';
        }

        // --- 模式 2：時鐘解碼 ---
        let task2Target = { h: 0, m: 0 };

        function generateTask2() {
            hideFeedback(2);
            // 隨機產生 1-12 點，0-55 分 (5的倍數)
            task2Target.h = Math.floor(Math.random() * 12) + 1;
            task2Target.m = Math.floor(Math.random() * 12) * 5;
            
            const padM = task2Target.m.toString().padStart(2, '0');
            document.getElementById('task-2-desc').innerHTML = 
                `請將左方的時鐘調整到：<br><strong style="font-size: 2rem; color: var(--primary); display: block; margin-top: 10px;">${task2Target.h} 點 ${padM} 分</strong>`;
        }

        function checkMode2() {
            let normalizedMinutes = ((totalMinutes % (24 * 60)) + (24 * 60)) % (24 * 60);
            let currentH = Math.floor(normalizedMinutes / 60) % 12;
            if (currentH === 0) currentH = 12;
            let currentM = Math.floor(normalizedMinutes % 60);

            if (currentH === task2Target.h && currentM === task2Target.m) {
                showFeedback(2, true, '答對了！太棒了！🎉');
            } else {
                showFeedback(2, false, '好像不太對喔，再觀察一下指針的位置 🤔');
            }
        }

        // --- 模式 3：時間推理 ---
        const wordProblems = [
            { q: "現在是 3:20，再過 30 分鐘是幾點？", options: ["3:50", "4:00", "3:10"], ans: 0 },
            { q: "電影 7:10 開始，現在是 6:50，還要等多久？", options: ["10 分鐘", "20 分鐘", "30 分鐘"], ans: 1 },
            { q: "蛋糕需要烤 45 分鐘，現在是 2:15 放進烤箱，什麼時候會烤好？", options: ["2:45", "3:00", "3:15"], ans: 1 },
            { q: "小明從 4:30 開始寫功課，寫了 50 分鐘，寫完時是幾點？", options: ["5:10", "5:20", "5:30"], ans: 1 },
            { q: "火車 10:05 開車，提早 15 分鐘要到月台，最晚幾點要到？", options: ["9:45", "9:50", "10:00"], ans: 1 }
        ];
        let currentTask3Obj = null;
        let selectedOptionIndex = -1;

        function generateTask3() {
            hideFeedback(3);
            selectedOptionIndex = -1;
            
            // 隨機挑選一題
            const randIdx = Math.floor(Math.random() * wordProblems.length);
            currentTask3Obj = wordProblems[randIdx];
            
            document.getElementById('task-3-desc').textContent = currentTask3Obj.q;
            
            const optionsContainer = document.getElementById('task-3-options');
            optionsContainer.innerHTML = '';
            
            currentTask3Obj.options.forEach((opt, idx) => {
                const label = document.createElement('label');
                label.className = 'option-label';
                label.innerHTML = `
                    <input type="radio" name="task3-opt" value="${idx}">
                    <span>${opt}</span>
                `;
                label.addEventListener('click', () => {
                    document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
                    label.classList.add('selected');
                    selectedOptionIndex = idx;
                });
                optionsContainer.appendChild(label);
            });
        }

        function checkMode3() {
            if (selectedOptionIndex === -1) {
                showFeedback(3, false, '請先選擇一個答案喔！');
                return;
            }
            
            if (selectedOptionIndex === currentTask3Obj.ans) {
                showFeedback(3, true, '推理正確！你真棒！🎉');
            } else {
                showFeedback(3, false, '再想一下，可以利用左邊的時鐘幫忙計算喔！🤔');
            }
        }

        // 系統初始化
        initClockFace();
        updateClock(false);

    </script>
</body>
</html>
