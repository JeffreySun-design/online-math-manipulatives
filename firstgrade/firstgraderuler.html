<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>互動直尺教學</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM (UMD for standalone usage) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for compiling JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Noto Sans TC', sans-serif;
        background-color: #FEF9C3; /* yellow-50 */
        overscroll-behavior: none;
      }
      canvas {
        touch-action: none; /* Prevent scrolling while dragging on canvas */
      }
      /* Hide scrollbar for clean UI */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;

      // --- 1. CONSTANTS ---
      const PIXELS_PER_CM = 45;
      const RULER_LENGTH_CM = 15;
      const RULER_HEIGHT = 80;
      const CANVAS_WIDTH = 1024;
      const CANVAS_HEIGHT = 600;

      const COLORS = {
        rulerBg: 'rgba(255, 255, 255, 0.85)',
        rulerBorder: '#94A3B8',
        rulerTick: '#334155',
        blockFill: '#F472B6',
        blockStroke: '#DB2777',
        guideLine: '#EF4444',
        arc: '#3B82F6',
        arcText: '#1D4ED8',
        feedbackSuccess: '#22C55E',
        feedbackWarn: '#EAB308',
        river: '#60A5FA',
        bank: '#84CC16',
        bridge: '#92400E',
        frog: '#16A34A',
      };

      const INITIAL_OBJECTS = [
        { id: 'pencil', type: 'pencil', x: 100, y: 150, width: 8 * PIXELS_PER_CM, height: 30, color: '#FBBF24', rotation: 0, label: '鉛筆' },
        { id: 'eraser', type: 'eraser', x: 100, y: 250, width: 4 * PIXELS_PER_CM, height: 50, color: '#FFFFFF', rotation: 0, label: '橡皮擦' },
        { id: 'straw', type: 'straw', x: 100, y: 380, width: 12 * PIXELS_PER_CM, height: 20, color: '#1F2937', rotation: 0, label: '珍珠奶茶吸管' }
      ];

      const LIBRARY_TEMPLATES = {
        book: { type: 'book', width: 10 * PIXELS_PER_CM, height: 120, color: '#3B82F6', label: '故事書' },
        crayon: { type: 'crayon', width: 6 * PIXELS_PER_CM, height: 25, color: '#EF4444', label: '蠟筆' },
        car: { type: 'car', width: 7 * PIXELS_PER_CM, height: 60, color: '#10B981', label: '玩具車' }
      };

      // --- 2. RULER CANVAS COMPONENT ---
      const RulerCanvas = ({ appMode, mode, objects, setObjects, showGrid, showMm, showGuideline, snapEnabled, showBlocks, resetSignal, gameState, onFrogAnimationComplete }) => {
        const canvasRef = useRef(null);
        
        const [ruler, setRuler] = useState({
          x: 50,
          y: 50,
          width: RULER_LENGTH_CM * PIXELS_PER_CM + 40, 
          height: RULER_HEIGHT,
          isDragging: false
        });
        const [arcs, setArcs] = useState([]);
        const [dragTarget, setDragTarget] = useState(null);

        const animationRef = useRef(0);
        const frogPosRef = useRef({ x: 0, y: 0, vy: 0 });

        useEffect(() => {
          setRuler({
            x: 50,
            y: appMode === 'game' ? 350 : 50,
            width: RULER_LENGTH_CM * PIXELS_PER_CM + 40,
            height: RULER_HEIGHT,
            isDragging: false
          });
          setArcs([]);
        }, [resetSignal, appMode]);

        useEffect(() => {
          setArcs([]);
        }, [mode]);

        const getCanvasPos = (e) => {
          const canvas = canvasRef.current;
          if (!canvas) return { x: 0, y: 0 };
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        };

        const drawFrog = (ctx, x, y, isSplashing) => {
          ctx.save();
          ctx.translate(x, y);
          if (isSplashing) {
             ctx.fillStyle = '#60A5FA';
             for(let i=0; i<8; i++) {
               const angle = (Math.PI * 2 / 8) * i;
               ctx.beginPath(); ctx.arc(Math.cos(angle)*30, Math.sin(angle)*30, 8, 0, Math.PI*2); ctx.fill();
             }
          } else {
            ctx.fillStyle = COLORS.frog; ctx.beginPath(); ctx.ellipse(0, 0, 30, 25, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(-12, -20, 10, 0, Math.PI * 2); ctx.arc(12, -20, 10, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(-12, -20, 4, 0, Math.PI * 2); ctx.arc(12, -20, 4, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#064E3B'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 5, 10, 0, Math.PI); ctx.stroke();
            ctx.strokeStyle = COLORS.frog; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-20, 10); ctx.lineTo(-35, 20); ctx.moveTo(20, 10); ctx.lineTo(35, 20); ctx.stroke();
          }
          ctx.restore();
        };

        const drawGameScene = (ctx) => {
          const bankWidth = 150; const riverY = 150; const riverHeight = 250; const riverWidth = gameState.gapWidthCm * PIXELS_PER_CM;
          ctx.fillStyle = COLORS.river; ctx.fillRect(bankWidth, riverY, riverWidth, riverHeight);
          ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
          for(let i=0; i<5; i++) { const y = riverY + 40 + i * 40; ctx.beginPath(); ctx.moveTo(bankWidth, y); ctx.lineTo(bankWidth + riverWidth, y); ctx.stroke(); }
          ctx.fillStyle = COLORS.bank; ctx.fillRect(0, riverY, bankWidth, riverHeight); ctx.fillRect(bankWidth + riverWidth, riverY, CANVAS_WIDTH - (bankWidth + riverWidth), riverHeight);

          if (gameState.frogStatus !== 'idle') {
             const bridgeLen = parseFloat(gameState.userAnswer) * PIXELS_PER_CM;
             const bridgeY = riverY + riverHeight / 2 - 20;
             ctx.fillStyle = COLORS.bridge; ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 5;
             ctx.fillRect(bankWidth, bridgeY, bridgeLen, 40);
             ctx.fillStyle = 'rgba(0,0,0,0.1)'; for (let i=0; i<bridgeLen; i+=20) { ctx.fillRect(bankWidth + i, bridgeY, 2, 40); }
             ctx.shadowColor = 'transparent';
          }

          const startX = bankWidth - 40; const endX = bankWidth + riverWidth + 40; const centerY = riverY + riverHeight / 2;
          if (gameState.frogStatus === 'idle') {
            frogPosRef.current = { x: startX, y: centerY, vy: 0 };
          } else if (gameState.frogStatus === 'jumping') {
            frogPosRef.current.x += 10;
            frogPosRef.current.y = centerY - Math.abs(Math.sin(Date.now() / 100) * 30);
            if (frogPosRef.current.x >= endX) { onFrogAnimationComplete(); }
            else { const bridgeLen = parseFloat(gameState.userAnswer) * PIXELS_PER_CM; if (frogPosRef.current.x > bankWidth + bridgeLen + 15) { onFrogAnimationComplete(); } }
          } else if (gameState.frogStatus === 'falling') {
             frogPosRef.current.y += 10; if (frogPosRef.current.y > riverY + riverHeight - 20) { onFrogAnimationComplete(); }
          } else if (gameState.frogStatus === 'success') {
             frogPosRef.current.x = endX;
          }
          drawFrog(ctx, frogPosRef.current.x, frogPosRef.current.y, gameState.frogStatus === 'splashing');
        };

        const drawScene = useCallback(() => {
          const canvas = canvasRef.current; if (!canvas) return;
          const ctx = canvas.getContext('2d'); if (!ctx) return;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (appMode === 'free' && showGrid) {
            ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 1; const gridSize = PIXELS_PER_CM;
            ctx.beginPath(); for (let x = 0; x < canvas.width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
            for (let y = 0; y < canvas.height; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); } ctx.stroke();
          }

          if (appMode === 'game') {
            drawGameScene(ctx);
          } else {
            objects.forEach(obj => {
              ctx.save(); ctx.translate(obj.x, obj.y); ctx.rotate(obj.rotation);
              ctx.shadowColor = 'rgba(0,0,0,0.1)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;

              if (obj.type === 'pencil') {
                ctx.fillStyle = obj.color; ctx.fillRect(0, 0, obj.width - 40, obj.height);
                ctx.fillStyle = '#FDE68A'; ctx.beginPath(); ctx.moveTo(obj.width - 40, 0); ctx.lineTo(obj.width, obj.height / 2); ctx.lineTo(obj.width - 40, obj.height); ctx.fill();
                ctx.fillStyle = '#1F2937'; ctx.beginPath(); ctx.moveTo(obj.width - 10, obj.height / 2 - 3); ctx.lineTo(obj.width, obj.height / 2); ctx.lineTo(obj.width - 10, obj.height / 2 + 3); ctx.fill();
              } else if (obj.type === 'eraser') {
                ctx.fillStyle = obj.color; ctx.fillRect(0, 0, obj.width, obj.height); ctx.fillStyle = '#3B82F6'; ctx.fillRect(10, 0, obj.width / 2, obj.height);
              } else if (obj.type === 'straw') {
                ctx.fillStyle = obj.color; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(obj.width - 10, 0); ctx.lineTo(obj.width, obj.height); ctx.lineTo(0, obj.height); ctx.closePath(); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(0, 5, obj.width - 5, 3);
              } else if (obj.type === 'book') {
                ctx.fillStyle = obj.color; ctx.fillRect(0, 0, obj.width, obj.height); ctx.fillStyle = '#F8FAFC'; ctx.fillRect(obj.width - 10, 5, 5, obj.height - 10);
                ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(15, 0, 5, obj.height); ctx.fillStyle = 'white'; ctx.fillRect(30, 20, obj.width - 60, 20);
              } else if (obj.type === 'crayon') {
                ctx.fillStyle = obj.color; ctx.beginPath(); ctx.roundRect(0, 0, obj.width - 20, obj.height, obj.height / 2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(obj.width - 20, 0); ctx.lineTo(obj.width, obj.height / 2); ctx.lineTo(obj.width - 20, obj.height); ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(15, 5, obj.width - 45, obj.height - 10);
              } else if (obj.type === 'car') {
                 ctx.fillStyle = obj.color; ctx.beginPath(); ctx.moveTo(10, 25); ctx.lineTo(20, 0); ctx.lineTo(obj.width - 20, 0); ctx.lineTo(obj.width - 10, 25); ctx.fill();
                 ctx.fillRect(0, 25, obj.width, 25); ctx.fillStyle = '#93C5FD'; ctx.fillRect(25, 5, 20, 15); ctx.fillRect(obj.width - 45, 5, 20, 15);
                 ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(20, 50, 10, 0, Math.PI * 2); ctx.arc(obj.width - 20, 50, 10, 0, Math.PI * 2); ctx.fill();
              }
              if (obj.label) {
                ctx.shadowColor = 'transparent'; ctx.fillStyle = '#1E293B'; ctx.font = '16px "Noto Sans TC"'; ctx.textAlign = 'left'; ctx.fillText(obj.label, 0, obj.height + 20);
              }
              ctx.restore();

              if (!ruler.isDragging && mode !== 'blocks') {
                  const rulerPadding = 20; const rulerStartCm = mode === 'broken' ? 3 : 0; const rulerZeroX = ruler.x + rulerPadding + (rulerStartCm * PIXELS_PER_CM);
                  const diffX = Math.abs(rulerZeroX - obj.x); const closeVertical = (ruler.y + ruler.height >= obj.y - 20) && (ruler.y <= obj.y + obj.height + 20);
                  if (closeVertical) {
                    ctx.save(); ctx.translate(obj.x, obj.y - 35);
                    if (diffX < 3) { ctx.fillStyle = COLORS.feedbackSuccess; ctx.font = 'bold 20px "Noto Sans TC"'; ctx.fillText('✓ 準確!', 0, 0); }
                    else if (diffX < 15) { ctx.fillStyle = COLORS.feedbackWarn; ctx.font = 'bold 16px "Noto Sans TC"'; ctx.fillText('↔ 微調', 0, 0); }
                    ctx.restore();
                  }
              }
            });
          }

          ctx.save();
          ctx.translate(ruler.x, ruler.y);
          const startCm = mode === 'broken' ? 3 : 0; const rulerPixelStart = 20;

          if (mode === 'blocks' && showBlocks) {
            const blockSize = PIXELS_PER_CM;
            for (let i = 0; i < RULER_LENGTH_CM; i++) {
              ctx.fillStyle = (i % 2 === 0) ? COLORS.blockFill : '#FBCFE8'; ctx.strokeStyle = COLORS.blockStroke; ctx.lineWidth = 2;
              const blockX = rulerPixelStart + i * blockSize;
              ctx.fillRect(blockX, 20, blockSize, blockSize); ctx.strokeRect(blockX, 20, blockSize, blockSize);
              ctx.fillStyle = '#000'; ctx.font = 'bold 16px "Noto Sans TC"'; ctx.textAlign = 'center'; ctx.fillText((i + 1).toString(), blockX + blockSize / 2, 20 + blockSize / 2 + 6);
            }
            ctx.fillStyle = '#000'; ctx.font = '20px "Noto Sans TC"'; ctx.fillText("由 1公分 的積木組成", ruler.width / 2, -10);
          } else {
            ctx.shadowColor = 'rgba(0,0,0,0.15)'; ctx.shadowBlur = 15; ctx.shadowOffsetY = 8; ctx.fillStyle = COLORS.rulerBg; ctx.strokeStyle = COLORS.rulerBorder;
            if (mode === 'broken') {
              ctx.beginPath(); let jaggedX = rulerPixelStart + (startCm * PIXELS_PER_CM); ctx.moveTo(jaggedX, 0);
              for(let y = 0; y <= ruler.height; y+= 10) { ctx.lineTo(jaggedX + (Math.random() * 10 - 5), y); }
              ctx.lineTo(ruler.width, ruler.height); ctx.lineTo(ruler.width, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
            } else {
              ctx.beginPath(); ctx.roundRect(0, 0, ruler.width, ruler.height, 10); ctx.fill(); ctx.stroke();
            }
            ctx.shadowColor = 'transparent'; ctx.fillStyle = COLORS.rulerTick; ctx.textAlign = 'center';
            for (let i = 0; i <= RULER_LENGTH_CM; i++) {
              const xPos = rulerPixelStart + i * PIXELS_PER_CM;
              if (mode === 'broken' && (i < startCm || i === startCm)) continue;
              ctx.beginPath(); ctx.moveTo(xPos, 0); ctx.lineTo(xPos, 30); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
              ctx.font = 'bold 20px "Noto Sans TC"'; ctx.fillText(i.toString(), xPos, 55);
              if (showMm && i < RULER_LENGTH_CM) {
                 for (let m = 1; m < 10; m++) {
                   const mmPos = xPos + (m * (PIXELS_PER_CM / 10));
                   if (mode === 'broken' && (i < startCm)) continue;
                   ctx.beginPath(); ctx.moveTo(mmPos, 0); let h = 10; if (m === 5) h = 20; ctx.lineTo(mmPos, h); ctx.lineWidth = 1; ctx.stroke();
                 }
              }
            }
            ctx.font = '14px "Noto Sans TC"'; ctx.fillText("cm (公分)", ruler.width - 40, ruler.height - 10);
          }
          if (mode === 'broken' && arcs.length > 0) {
            arcs.forEach((arc) => {
              const startX = rulerPixelStart + arc.startX * PIXELS_PER_CM; const endX = rulerPixelStart + arc.endX * PIXELS_PER_CM;
              const midX = (startX + endX) / 2; const dist = Math.abs(endX - startX);
              ctx.beginPath(); ctx.moveTo(startX, 0); ctx.quadraticCurveTo(midX, -dist/2, endX, 0); ctx.strokeStyle = COLORS.arc; ctx.lineWidth = 3; ctx.stroke();
              ctx.fillStyle = COLORS.arcText; ctx.font = 'bold 14px Arial'; ctx.fillText("+1", midX, -dist/4 - 5);
            });
            if (arcs.length > 0) { ctx.fillStyle = COLORS.arcText; ctx.font = 'bold 24px "Noto Sans TC"'; ctx.fillText(`共 ${arcs.length} 公分`, ruler.width / 2, ruler.height + 40); }
          }
          ctx.restore();

          if (showGuideline && mode !== 'blocks') {
            const guideCm = startCm; const guideX = ruler.x + rulerPixelStart + (guideCm * PIXELS_PER_CM);
            ctx.beginPath(); ctx.setLineDash([5, 5]); ctx.moveTo(guideX, ruler.y + 30); ctx.lineTo(guideX, canvas.height); ctx.strokeStyle = COLORS.guideLine; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
          }
          if (appMode === 'game' && gameState.frogStatus !== 'idle') { animationRef.current = requestAnimationFrame(drawScene); }
        }, [appMode, mode, objects, ruler, showGrid, showMm, showGuideline, showBlocks, arcs, gameState, onFrogAnimationComplete]);

        const handleStart = (e) => {
          const pos = getCanvasPos(e);
          if (appMode === 'free') {
            for (let i = objects.length - 1; i >= 0; i--) {
              const obj = objects[i];
              if (pos.x >= obj.x && pos.x <= obj.x + obj.width && pos.y >= obj.y && pos.y <= obj.y + obj.height) {
                setDragTarget({ type: 'object', id: obj.id, offsetX: pos.x - obj.x, offsetY: pos.y - obj.y }); return;
              }
            }
          }
          if (pos.x >= ruler.x && pos.x <= ruler.x + ruler.width && pos.y >= ruler.y && pos.y <= ruler.y + ruler.height) {
            if (mode === 'broken' && appMode === 'free') {
              const rulerPixelStart = 20; const relativeX = pos.x - ruler.x - rulerPixelStart; const floorCm = Math.floor(relativeX / PIXELS_PER_CM);
              if (floorCm >= 3 && floorCm < RULER_LENGTH_CM && pos.y < ruler.y + 40) {
                 const existingIndex = arcs.findIndex(a => a.startX === floorCm);
                 if (existingIndex >= 0) { setArcs(prev => prev.filter((_, idx) => idx !== existingIndex)); }
                 else { setArcs(prev => [...prev, { id: Date.now().toString(), startX: floorCm, endX: floorCm + 1 }]); }
                 return;
              }
            }
            setDragTarget({ type: 'ruler', offsetX: pos.x - ruler.x, offsetY: pos.y - ruler.y });
          }
        };

        const handleMove = (e) => {
          if (!dragTarget) return; e.preventDefault(); const pos = getCanvasPos(e);
          if (dragTarget.type === 'object' && dragTarget.id) {
            setObjects(prev => prev.map(obj => { if (obj.id === dragTarget.id) return { ...obj, x: pos.x - dragTarget.offsetX, y: pos.y - dragTarget.offsetY }; return obj; }));
          } else if (dragTarget.type === 'ruler') {
            let newX = pos.x - dragTarget.offsetX; let newY = pos.y - dragTarget.offsetY;
            if (snapEnabled && appMode === 'free') {
              const rulerStartPixel = 20; const startCm = mode === 'broken' ? 3 : 0; const activeZeroOffset = rulerStartPixel + (startCm * PIXELS_PER_CM); const currentZeroX = newX + activeZeroOffset; const snapThreshold = 25;
              objects.forEach(obj => {
                if (Math.abs(currentZeroX - obj.x) < snapThreshold) newX = obj.x - activeZeroOffset;
                if (Math.abs((newY + ruler.height) - obj.y) < snapThreshold) newY = obj.y - ruler.height;
                if (Math.abs(newY - (obj.y + obj.height)) < snapThreshold) newY = obj.y + obj.height;
              });
            }
            setRuler(prev => ({ ...prev, x: newX, y: newY, isDragging: true }));
          }
        };

        const handleEnd = () => { setDragTarget(null); setRuler(prev => ({ ...prev, isDragging: false })); };

        useEffect(() => { drawScene(); return () => { if (animationRef.current) cancelAnimationFrame(animationRef.current); } }, [drawScene]);

        return (
          <div className="relative w-full h-full bg-white rounded-2xl shadow-inner border-4 border-yellow-200 overflow-hidden cursor-crosshair">
             <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} className="w-full h-full touch-none"
               onMouseDown={handleStart} onMouseMove={handleMove} onMouseUp={handleEnd} onMouseLeave={handleEnd}
               onTouchStart={handleStart} onTouchMove={handleMove} onTouchEnd={handleEnd} />
             {appMode === 'free' && mode === 'broken' && (
               <div className="absolute bottom-4 left-4 bg-white/90 p-3 rounded-lg shadow-lg pointer-events-none text-gray-600">
                  <p className="font-bold text-blue-600">💡 提示:</p><p>點擊直尺上的刻度間距來數格子!</p>
               </div>
             )}
          </div>
        );
      };

      // --- 3. MAIN APP COMPONENT ---
      const App = () => {
        const [appMode, setAppMode] = useState('free');
        const [mode, setMode] = useState('ruler');
        const [showGrid, setShowGrid] = useState(false);
        const [showMm, setShowMm] = useState(false);
        const [showGuideline, setShowGuideline] = useState(false);
        const [snapEnabled, setSnapEnabled] = useState(true);
        const [showBlocks, setShowBlocks] = useState(true);
        const [objects, setObjects] = useState(JSON.parse(JSON.stringify(INITIAL_OBJECTS)));
        const [resetSignal, setResetSignal] = useState(0);
        const [gameState, setGameState] = useState({
          level: 1, gapWidthCm: 5, userAnswer: '', frogStatus: 'idle', feedback: null
        });

        const generateLevel = (level) => {
          const gap = Math.floor(Math.random() * 7) + 3;
          setGameState({ level, gapWidthCm: gap, userAnswer: '', frogStatus: 'idle', feedback: null });
          setResetSignal(prev => prev + 1);
        };

        useEffect(() => { if (appMode === 'game') { generateLevel(1); } }, [appMode]);

        const handleGameSubmit = () => {
          const inputVal = parseFloat(gameState.userAnswer); if (isNaN(inputVal)) return;
          if (inputVal === gameState.gapWidthCm) { setGameState(prev => ({ ...prev, frogStatus: 'jumping', feedback: '太棒了！青蛙過河了！' })); }
          else if (inputVal < gameState.gapWidthCm) { setGameState(prev => ({ ...prev, frogStatus: 'jumping', feedback: '哎呀！橋太短了！' })); }
          else { setGameState(prev => ({ ...prev, frogStatus: 'jumping', feedback: '哎呀！橋太長了！' })); }
        };

        const handleAdjustAnswer = (delta) => {
          const current = parseFloat(gameState.userAnswer) || 0;
          const next = Math.max(0, Math.min(15, current + delta));
          setGameState(prev => ({ ...prev, userAnswer: next.toString() }));
        };

        const onFrogAnimationComplete = () => {
          const inputVal = parseFloat(gameState.userAnswer);
          if (gameState.frogStatus === 'jumping') {
            if (inputVal === gameState.gapWidthCm) { setGameState(prev => ({ ...prev, frogStatus: 'success' })); }
            else { setGameState(prev => ({ ...prev, frogStatus: 'falling' })); }
          } else if (gameState.frogStatus === 'falling') { setGameState(prev => ({ ...prev, frogStatus: 'splashing' })); }
        };

        const handleReset = () => {
          setResetSignal(prev => prev + 1);
          if (appMode === 'free') { setObjects(JSON.parse(JSON.stringify(INITIAL_OBJECTS))); setShowBlocks(true); }
          else { generateLevel(gameState.level); }
        };

        const toggleMode = (newMode) => { setMode(newMode); setShowBlocks(true); setShowGuideline(false); };

        const addObject = (templateKey) => {
          const template = LIBRARY_TEMPLATES[templateKey];
          const newObject = { ...template, id: `${template.type}-${Date.now()}`, x: 150 + Math.random() * 50, y: 150 + Math.random() * 200, rotation: 0, type: template.type };
          setObjects(prev => [...prev, newObject]);
        };

        return (
          <div className="min-h-screen bg-yellow-50 font-sans text-slate-800 flex flex-col">
            <nav className="bg-white shadow-md p-2 flex justify-center gap-4 sticky top-0 z-10">
              <button onClick={() => setAppMode('free')} className={`px-6 py-2 rounded-full flex items-center gap-2 font-bold transition-all ${appMode === 'free' ? 'bg-yellow-400 text-white shadow-lg scale-105' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                🏫 自由探索
              </button>
              <button onClick={() => setAppMode('game')} className={`px-6 py-2 rounded-full flex items-center gap-2 font-bold transition-all ${appMode === 'game' ? 'bg-green-500 text-white shadow-lg scale-105' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                🎮 闖關挑戰
              </button>
            </nav>

            <div className="flex-1 flex flex-col md:flex-row p-4 md:p-6 gap-6 overflow-hidden">
              <aside className="w-full md:w-80 flex flex-col gap-4 shrink-0 overflow-y-auto no-scrollbar pb-10">
                <div className="flex items-center justify-between">
                   <h1 className="text-2xl font-bold text-slate-800">
                     {appMode === 'free' ? '互動直尺教學' : `第 ${gameState.level} 關: 青蛙過河`}
                   </h1>
                   <button onClick={handleReset} className="p-2 bg-white rounded-full border hover:bg-slate-50 shadow-sm" title="重置">
                      🔄
                   </button>
                </div>

                {appMode === 'free' ? (
                  <>
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2">
                      <h2 className="text-lg font-bold text-slate-700 mb-2">測量工具</h2>
                      <button onClick={() => toggleMode('blocks')} className={`w-full p-3 rounded-xl flex items-center gap-3 transition-all ${mode === 'blocks' ? 'bg-pink-100 text-pink-700 ring-2 ring-pink-400 font-bold' : 'bg-slate-50 hover:bg-slate-100'}`}>
                        🧱 <span>積木模式</span>
                      </button>
                      <button onClick={() => toggleMode('ruler')} className={`w-full p-3 rounded-xl flex items-center gap-3 transition-all ${mode === 'ruler' ? 'bg-blue-100 text-blue-700 ring-2 ring-blue-400 font-bold' : 'bg-slate-50 hover:bg-slate-100'}`}>
                        📏 <span>標準直尺</span>
                      </button>
                      <button onClick={() => toggleMode('broken')} className={`w-full p-3 rounded-xl flex items-center gap-3 transition-all ${mode === 'broken' ? 'bg-orange-100 text-orange-700 ring-2 ring-orange-400 font-bold' : 'bg-slate-50 hover:bg-slate-100'}`}>
                        ✂️ <span>斷尺挑戰</span>
                      </button>
                    </div>

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                       {mode === 'blocks' ? (
                         <button onClick={() => setShowBlocks(!showBlocks)} className={`w-full py-2 rounded-xl font-bold text-white shadow-md ${showBlocks ? 'bg-green-400 hover:bg-green-500' : 'bg-pink-400 hover:bg-pink-500'}`}>
                           {showBlocks ? '✨ 合併成直尺' : '🧱 顯示積木'}
                         </button>
                       ) : (
                         <>
                           <div className="flex justify-between items-center">
                              <span className="flex items-center gap-2 text-slate-600">📐 對齊紅線</span>
                              <div onClick={() => setShowGuideline(!showGuideline)} className={`w-12 h-6 rounded-full relative cursor-pointer ${showGuideline ? 'bg-green-400' : 'bg-slate-200'}`}>
                                <div className={`absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-all ${showGuideline ? 'translate-x-6' : ''}`}/>
                              </div>
                           </div>
                           <div className="flex justify-between items-center">
                              <span className="flex items-center gap-2 text-slate-600">🧲 磁鐵吸附</span>
                              <div onClick={() => setSnapEnabled(!snapEnabled)} className={`w-12 h-6 rounded-full relative cursor-pointer ${snapEnabled ? 'bg-green-400' : 'bg-slate-200'}`}>
                                <div className={`absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-all ${snapEnabled ? 'translate-x-6' : ''}`}/>
                              </div>
                           </div>
                         </>
                       )}
                       <div className="flex justify-between items-center pt-2 border-t">
                          <span className="flex items-center gap-2 text-slate-600">▦ 背景網格</span>
                          <div onClick={() => setShowGrid(!showGrid)} className={`w-12 h-6 rounded-full relative cursor-pointer ${showGrid ? 'bg-green-400' : 'bg-slate-200'}`}>
                            <div className={`absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-all ${showGrid ? 'translate-x-6' : ''}`}/>
                          </div>
                       </div>
                    </div>

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                       <h2 className="text-lg font-bold text-slate-700 flex items-center gap-2 mb-3">➕ 物品庫</h2>
                       <div className="grid grid-cols-3 gap-2">
                         {Object.entries(LIBRARY_TEMPLATES).map(([key, item]) => (
                           <button key={key} onClick={() => addObject(key)} className="flex flex-col items-center p-2 bg-slate-50 rounded-lg hover:bg-slate-100">
                             <span className="text-2xl">{key === 'book' ? '📘' : key === 'crayon' ? '🖍️' : '🚗'}</span>
                             <span className="text-xs text-slate-600 mt-1">{item.label}</span>
                           </button>
                         ))}
                       </div>
                    </div>
                  </>
                ) : (
                  <div className="flex flex-col gap-4 h-full">
                    <div className="bg-green-50 p-5 rounded-2xl border-2 border-green-200">
                       <h2 className="text-xl font-bold text-green-800 mb-2 flex items-center gap-2">
                         🏫 任務說明
                       </h2>
                       <p className="text-green-700 text-base leading-relaxed">
                         1. 拖動直尺測量河寬。<br/>
                         2. 用下方按鈕調整答案。<br/>
                         3. 搭建橋樑讓青蛙過河！
                       </p>
                    </div>

                    <div className="flex-1 bg-white rounded-3xl shadow-sm border border-slate-200 p-6 flex flex-col items-center justify-center gap-6">
                        <div className="text-center w-full">
                          <label className="text-slate-500 font-bold mb-2 block">這條河有多寬?</label>
                          <div className="bg-slate-100 rounded-2xl p-4 mb-2 flex justify-center items-baseline gap-2">
                             <span className="text-6xl font-black text-blue-600 font-mono">
                               {gameState.userAnswer || '0'}
                             </span>
                             <span className="text-2xl font-bold text-slate-400">cm</span>
                          </div>
                        </div>

                        <div className="w-full space-y-4">
                            <input 
                              type="range" min="0" max="15" step="1"
                              value={gameState.userAnswer || 0}
                              onChange={(e) => setGameState({...gameState, userAnswer: e.target.value})}
                              className="w-full h-4 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-500 hover:accent-blue-400"
                              disabled={gameState.frogStatus !== 'idle'}
                            />
                            <div className="flex justify-between gap-4">
                               <button 
                                 onClick={() => handleAdjustAnswer(-1)}
                                 disabled={gameState.frogStatus !== 'idle'}
                                 className="flex-1 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 text-slate-700 rounded-xl py-3 font-black text-2xl shadow-sm active:scale-95 transition-all"
                               >-</button>
                               <button 
                                 onClick={() => handleAdjustAnswer(1)}
                                 disabled={gameState.frogStatus !== 'idle'}
                                 className="flex-1 bg-blue-100 hover:bg-blue-200 disabled:opacity-50 text-blue-700 rounded-xl py-3 font-black text-2xl shadow-sm active:scale-95 transition-all"
                               >+</button>
                            </div>
                        </div>

                        {gameState.frogStatus === 'idle' ? (
                          <button 
                            onClick={handleGameSubmit}
                            disabled={!gameState.userAnswer || parseFloat(gameState.userAnswer) === 0}
                            className="w-full py-4 bg-blue-500 hover:bg-blue-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white text-xl rounded-2xl font-bold shadow-lg shadow-blue-200 transition-all active:scale-95 flex justify-center items-center gap-3"
                          >
                            搭建橋樑 🔨
                          </button>
                        ) : (
                          gameState.frogStatus === 'success' || gameState.frogStatus === 'splashing' ? (
                             <button 
                              onClick={() => generateLevel(gameState.level + 1)}
                              className={`w-full py-4 text-white text-xl rounded-2xl font-bold shadow-lg animate-bounce ${
                                gameState.frogStatus === 'success' ? 'bg-green-500 hover:bg-green-600 shadow-green-200' : 'bg-orange-500 hover:bg-orange-600 shadow-orange-200'
                              }`}
                             >
                               {gameState.frogStatus === 'success' ? '下一關 ➡️' : '再試一次 🔄'}
                             </button>
                          ) : (
                             <div className="text-xl font-bold text-slate-400 animate-pulse py-4">
                               🚧 施工中...
                             </div>
                          )
                        )}

                        {gameState.feedback && (
                           <div className={`w-full p-3 rounded-xl text-center font-bold animate-in fade-in slide-in-from-bottom-2 ${
                              gameState.feedback.includes('棒') 
                                ? 'bg-green-100 text-green-700 border border-green-200' 
                                : 'bg-red-50 text-red-600 border border-red-200'
                           }`}>
                             {gameState.feedback}
                           </div>
                        )}
                    </div>
                  </div>
                )}

              </aside>

              <section className="flex-1 relative bg-white rounded-3xl shadow-lg border-4 border-yellow-200 overflow-hidden">
                <RulerCanvas 
                  appMode={appMode}
                  mode={mode}
                  objects={objects}
                  setObjects={setObjects}
                  showGrid={showGrid}
                  showMm={showMm}
                  showGuideline={showGuideline}
                  snapEnabled={snapEnabled}
                  showBlocks={showBlocks}
                  resetSignal={resetSignal}
                  gameState={gameState}
                  onFrogAnimationComplete={onFrogAnimationComplete}
                />
              </section>

            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
