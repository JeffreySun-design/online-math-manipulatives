<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>快樂便利商店</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 React 與 ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- 引入 Babel 以在瀏覽器中編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overscroll-behavior: none;
    }
    /* 隱藏滾動條但保留滾動功能 */
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    /* 地板磁磚背景 */
    .bg-tiled-floor {
      background-color: #FDE6B0;
      background-image: 
        linear-gradient(45deg, #F5D0A9 25%, transparent 25%, transparent 75%, #F5D0A9 75%, #F5D0A9),
        linear-gradient(45deg, #F5D0A9 25%, transparent 25%, transparent 75%, #F5D0A9 75%, #F5D0A9);
      background-position: 0 0, 30px 30px;
      background-size: 60px 60px;
    }
  </style>
</head>
<body class="bg-slate-100 h-screen w-screen overflow-hidden select-none">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useMemo } = React;

    // --- Types ---
    const CurrencyType = {
      COIN: 'COIN',
      BILL: 'BILL'
    };

    // --- Constants ---
    const PRODUCTS = [
      { id: 'p1', name: '茶葉蛋', price: 13, emoji: '🥚', color: 'bg-amber-100' },
      { id: 'p2', name: '棒棒糖', price: 8, emoji: '🍭', color: 'bg-pink-100' },
      { id: 'p3', name: '礦泉水', price: 20, emoji: '💧', color: 'bg-blue-100' },
      { id: 'p4', name: '布丁', price: 25, emoji: '🍮', color: 'bg-yellow-100' },
      { id: 'p5', name: '果汁', price: 35, emoji: '🧃', color: 'bg-orange-100' },
      { id: 'p6', name: '洋芋片', price: 45, emoji: '🥔', color: 'bg-red-100' },
      { id: 'p7', name: '御飯糰', price: 39, emoji: '🍙', color: 'bg-green-100' },
      { id: 'p8', name: '便當', price: 85, emoji: '🍱', color: 'bg-slate-200' },
      { id: 'p9', name: '麵包', price: 22, emoji: '🍞', color: 'bg-orange-200' },
      { id: 'p10', name: '牛奶', price: 32, emoji: '🥛', color: 'bg-blue-50' },
      { id: 'p11', name: '巧克力', price: 15, emoji: '🍫', color: 'bg-amber-800' },
      { id: 'p12', name: '餅乾', price: 20, emoji: '🍪', color: 'bg-amber-200' },
    ];

    const CURRENCY = [
      { value: 1, type: CurrencyType.COIN, label: '1', color: 'bg-amber-600', textColor: 'text-white', borderColor: 'border-amber-800', size: 'w-12 h-12' },
      { value: 5, type: CurrencyType.COIN, label: '5', color: 'bg-slate-300', textColor: 'text-slate-700', borderColor: 'border-slate-500', size: 'w-14 h-14' },
      { value: 10, type: CurrencyType.COIN, label: '10', color: 'bg-slate-200', textColor: 'text-slate-800', borderColor: 'border-slate-400', size: 'w-16 h-16' },
      { value: 50, type: CurrencyType.COIN, label: '50', color: 'bg-yellow-400', textColor: 'text-yellow-900', borderColor: 'border-yellow-600', size: 'w-20 h-20' },
      { value: 100, type: CurrencyType.BILL, label: '100', color: 'bg-red-500', textColor: 'text-white', borderColor: 'border-red-700', size: 'w-40 h-20' },
    ];

    // --- Utils ---
    const calculateChangeBreakdown = (amount) => {
      let remaining = amount;
      const result = [];
      const sortedCurrency = [...CURRENCY].sort((a, b) => b.value - a.value);
      for (const money of sortedCurrency) {
        while (remaining >= money.value) {
          result.push(money);
          remaining -= money.value;
        }
      }
      return result;
    };

    // --- Components ---
    const Money = ({ info, onClick, className = '' }) => {
      const baseClasses = "flex items-center justify-center font-bold shadow-[0_4px_0_rgba(0,0,0,0.2)] active:shadow-none active:translate-y-1 transition-all select-none";
      if (info.type === CurrencyType.COIN) {
        return (
          <div onClick={onClick} className={`${baseClasses} rounded-full border-4 ${info.size} ${info.color} ${info.textColor} ${info.borderColor} ${className} relative cursor-pointer`}>
            <div className="absolute inset-0 rounded-full border border-white/30"></div>
            <span className="text-xl md:text-3xl drop-shadow-md">{info.label}</span>
            <span className="text-[10px] md:text-xs absolute bottom-1 md:bottom-2 opacity-70">元</span>
          </div>
        );
      }
      return (
        <div onClick={onClick} className={`${baseClasses} rounded-md border-4 ${info.size} ${info.color} ${info.textColor} ${info.borderColor} ${className} relative overflow-hidden cursor-pointer`}>
          <div className="absolute -right-4 -top-4 w-12 h-12 rounded-full bg-white/20"></div>
          <div className="absolute -left-4 -bottom-4 w-12 h-12 rounded-full bg-white/20"></div>
          <span className="text-2xl md:text-4xl drop-shadow-md z-10">{info.label}</span>
          <span className="text-xs md:text-sm absolute bottom-1 right-2 z-10">圓</span>
        </div>
      );
    };

    const ProductCard = ({ product, onAdd }) => {
      return (
        <div onClick={() => onAdd(product)} className="flex flex-col items-center justify-end h-full cursor-pointer group relative active:scale-95 transition-transform">
          <div className={`w-20 h-20 md:w-24 md:h-24 flex items-center justify-center text-5xl md:text-6xl drop-shadow-xl z-10 transition-transform group-hover:-translate-y-2`}>
            {product.emoji}
          </div>
          <div className="mt-1 bg-white border-2 border-slate-300 shadow-sm px-2 py-1 transform rotate-[-2deg] group-hover:rotate-0 transition-transform relative top-2">
             <div className="absolute -top-2 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-slate-800 rounded-full"></div>
             <div className="text-sm font-bold text-slate-800 leading-none text-center">{product.name}</div>
             <div className="text-lg font-black text-red-600 leading-none text-center">${product.price}</div>
          </div>
        </div>
      );
    };

    const Shopkeeper = ({ state }) => {
      const getAnimationClass = () => {
        switch (state) {
          case 'HAPPY': return 'animate-bounce';
          case 'SURPRISED': return 'animate-[shake_0.5s_ease-in-out]';
          default: return 'animate-[breathing_4s_ease-in-out_infinite]';
        }
      };

      return (
        <div className={`relative w-48 h-48 md:w-64 md:h-64 flex justify-center items-end ${getAnimationClass()}`}>
          <style>{`
            @keyframes breathing {
              0%, 100% { transform: scale(1) translateY(0); }
              50% { transform: scale(1.02) translateY(-2px); }
            }
            @keyframes shake {
              0%, 100% { transform: translateX(0); }
              25% { transform: translateX(-5px); }
              75% { transform: translateX(5px); }
            }
          `}</style>
          <div className="relative w-full h-full flex flex-col items-center">
            <div className="relative z-20 flex flex-col items-center top-4 hover:scale-105 transition-transform">
                <div className="relative z-30 -mb-4">
                    <div className="w-32 h-14 bg-blue-600 rounded-t-full border-4 border-blue-800 shadow-md"></div>
                    <div className="absolute bottom-0 -right-4 w-14 h-5 bg-blue-600 border-4 border-blue-800 rounded-r-lg transform rotate-12 shadow-sm"></div> 
                </div>
                <div className="w-32 h-28 bg-[#D7CCC8] rounded-[2.5rem] border-4 border-[#8D6E63] relative z-20 flex flex-col items-center justify-center shadow-inner">
                    <div className="absolute inset-2 bg-[#EFEBE9] rounded-[2rem] opacity-80"></div>
                    <div className="absolute top-8 left-4 w-10 h-8 bg-[#5D4037] rounded-full transform -rotate-12 opacity-90"></div>
                    <div className="absolute top-8 right-4 w-10 h-8 bg-[#5D4037] rounded-full transform rotate-12 opacity-90"></div>
                    <div className="absolute top-10 flex gap-10 z-10">
                        <div className={`w-2 h-2 bg-black rounded-full transition-all ${state === 'SURPRISED' ? 'scale-[2.5]' : ''}`}></div>
                        <div className={`w-2 h-2 bg-black rounded-full transition-all ${state === 'SURPRISED' ? 'scale-[2.5]' : ''}`}></div>
                    </div>
                    <div className="absolute top-[3.8rem] w-6 h-4 bg-[#3E2723] rounded-full z-10"></div>
                    <div className="absolute top-[5rem] z-10 transition-all">
                        {state === 'HAPPY' ? (
                             <div className="w-8 h-4 border-b-4 border-[#3E2723] rounded-full"></div>
                        ) : state === 'SURPRISED' ? (
                            <div className="w-6 h-6 rounded-full bg-[#3E2723] border-2 border-black"></div>
                        ) : (
                            <div className="w-6 h-2 border-b-2 border-[#3E2723] rounded-full"></div>
                        )}
                    </div>
                </div>
            </div>
            <div className="relative z-10 -mt-6">
                 <div className="w-16 h-8 bg-[#D7CCC8] mx-auto border-x-4 border-[#8D6E63]"></div>
                 <div className="w-40 h-28 bg-blue-500 rounded-t-[3rem] border-4 border-blue-700 flex justify-center relative overflow-hidden shadow-lg">
                    <div className="w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-t-[40px] border-t-[#D7CCC8] absolute top-0"></div>
                    <div className="absolute top-12 left-6 w-10 h-10 bg-blue-600 rounded-bl-lg border-2 border-blue-800">
                        <div className="w-full h-2 bg-white mt-2"></div>
                    </div>
                    <div className="absolute bottom-0 left-0 w-8 h-12 bg-blue-600 rounded-tr-xl border-t-2 border-r-2 border-blue-800"></div>
                    <div className="absolute bottom-0 right-0 w-8 h-12 bg-blue-600 rounded-tl-xl border-t-2 border-l-2 border-blue-800"></div>
                 </div>
            </div>
          </div>
        </div>
      );
    };

    const ShoppingCart = ({ items }) => {
      const total = items.reduce((acc, item) => acc + item.price, 0);

      const itemPositions = useMemo(() => {
        return items.map(() => ({
          rotation: Math.random() * 40 - 20,
          xOffset: Math.random() * 40 - 20,
          yOffset: Math.random() * -20,
          scale: 0.9 + Math.random() * 0.2
        }));
      }, [items.length]);

      return (
        <div className="relative w-[320px] h-[288px] group origin-bottom-left z-50">
            <div className="absolute top-0 right-0 bg-yellow-300 text-red-700 px-4 py-2 rounded-lg border-4 border-yellow-600 font-mono text-3xl font-black shadow-xl z-50 transform rotate-12 animate-pulse origin-top-right">
               ${total}
            </div>
            <svg viewBox="0 0 320 288" className="absolute inset-0 w-full h-full pointer-events-none z-0 drop-shadow-md">
              <path d="M 80 180 L 60 250 L 240 250 L 230 180" stroke="#475569" strokeWidth="8" fill="none" strokeLinecap="round" strokeLinejoin="round" />
              <path d="M 60 250 L 40 230 L 80 180" stroke="#475569" strokeWidth="6" fill="none" strokeLinecap="round" strokeLinejoin="round" />
              <path d="M 50 215 L 225 215" stroke="#64748b" strokeWidth="4" strokeLinecap="round" />
              <path d="M 70 235 L 235 235" stroke="#64748b" strokeWidth="4" strokeLinecap="round" />
              <path d="M 50 250 L 70 250 L 65 265 L 55 265 Z" fill="#475569" />
              <path d="M 230 250 L 250 250 L 245 265 L 235 265 Z" fill="#475569" />
              <circle cx="60" cy="270" r="14" fill="#1e293b" />
              <circle cx="60" cy="270" r="5" fill="#cbd5e1" />
              <circle cx="240" cy="270" r="14" fill="#1e293b" />
              <circle cx="240" cy="270" r="5" fill="#cbd5e1" />
              <path d="M 260 40 L 285 15 L 310 15" stroke="#64748b" strokeWidth="8" fill="none" strokeLinecap="round" strokeLinejoin="round" />
              <line x1="280" y1="15" x2="315" y2="15" stroke="#ef4444" strokeWidth="14" strokeLinecap="round" />
              <path d="M 40 40 L 260 40 L 230 180 L 80 180 Z" stroke="none" fill="rgba(148, 163, 184, 0.1)" />
              <line x1="260" y1="40" x2="200" y2="180" stroke="#94a3b8" strokeWidth="4" />
            </svg>
            <div className="absolute top-[40px] left-[60px] w-[180px] h-[140px] z-10 flex flex-wrap-reverse content-start justify-center items-end pb-2">
                {items.map((item, index) => (
                    <div 
                        key={item.cartId}
                        className="flex items-center justify-center text-5xl drop-shadow-md filter transition-transform hover:scale-125 hover:z-50 cursor-help"
                        style={{
                            transform: `rotate(${itemPositions[index]?.rotation || 0}deg) translateX(${itemPositions[index]?.xOffset || 0}px) translateY(${itemPositions[index]?.yOffset || 0}px) scale(${itemPositions[index]?.scale || 1})`,
                            marginBottom: '-5px',
                            marginLeft: '-5px',
                            marginRight: '-5px',
                            zIndex: index
                        }}
                        title={`${item.name} $${item.price}`}
                    >
                        {item.emoji}
                    </div>
                ))}
            </div>
            <svg viewBox="0 0 320 288" className="absolute inset-0 w-full h-full pointer-events-none z-20">
              <path d="M 40 40 L 260 40 L 230 180 L 80 180 Z" stroke="#64748b" strokeWidth="6" fill="rgba(241, 245, 249, 0.2)" strokeLinejoin="round" />
              <line x1="48" y1="68" x2="254" y2="68" stroke="#94a3b8" strokeWidth="3" />
              <line x1="56" y1="96" x2="248" y2="96" stroke="#94a3b8" strokeWidth="3" />
              <line x1="64" y1="124" x2="242" y2="124" stroke="#94a3b8" strokeWidth="3" />
              <line x1="72" y1="152" x2="236" y2="152" stroke="#94a3b8" strokeWidth="3" />
              <line x1="70" y1="40" x2="100" y2="180" stroke="#94a3b8" strokeWidth="3" />
              <line x1="100" y1="40" x2="120" y2="180" stroke="#94a3b8" strokeWidth="3" />
              <line x1="130" y1="40" x2="140" y2="180" stroke="#94a3b8" strokeWidth="3" />
              <line x1="160" y1="40" x2="160" y2="180" stroke="#94a3b8" strokeWidth="3" />
              <line x1="190" y1="40" x2="180" y2="180" stroke="#94a3b8" strokeWidth="3" />
              <line x1="220" y1="40" x2="200" y2="180" stroke="#94a3b8" strokeWidth="3" />
              <line x1="250" y1="40" x2="220" y2="180" stroke="#94a3b8" strokeWidth="3" />
            </svg>
        </div>
      );
    };

    // --- Main App Component ---
    function App() {
      const [screen, setScreen] = useState('SHOP');
      const [cart, setCart] = useState([]);
      const [paymentZoneMoney, setPaymentZoneMoney] = useState([]);
      const [changeMoney, setChangeMoney] = useState(null);
      const [feedbackMessage, setFeedbackMessage] = useState("");
      const [shopkeeperState, setShopkeeperState] = useState('IDLE');
      const [isWalletOpen, setIsWalletOpen] = useState(false);

      useEffect(() => {
        if (screen === 'CHECKOUT') {
          setPaymentZoneMoney([]);
          setChangeMoney(null);
          setFeedbackMessage("");
          setShopkeeperState('IDLE');
          setIsWalletOpen(false);
        }
      }, [screen]);

      const handleAddToCart = (product) => {
        const newItem = {
          ...product,
          cartId: Math.random().toString(36).substr(2, 9),
        };
        setCart((prev) => [...prev, newItem]);
      };

      const calculateTotal = () => cart.reduce((sum, item) => sum + item.price, 0);
      const calculatePaymentTotal = () => paymentZoneMoney.reduce((sum, m) => sum + m.value, 0);
      const calculateChangeTotal = () => changeMoney ? changeMoney.reduce((sum, m) => sum + m.value, 0) : 0;

      const handlePayment = () => {
        const totalCost = calculateTotal();
        const totalPaid = calculatePaymentTotal();

        if (totalPaid < totalCost) {
          setFeedbackMessage("錢不夠喔！");
          setShopkeeperState('SURPRISED');
          setTimeout(() => setShopkeeperState('IDLE'), 2000);
          return;
        }

        const change = totalPaid - totalCost;
        const breakdown = calculateChangeBreakdown(change);
        setChangeMoney(breakdown);
        setFeedbackMessage(change === 0 ? "剛好！謝謝光臨！" : `找你 ${change} 元！`);
        setShopkeeperState('HAPPY');
      };

      const addToPaymentZone = (money) => {
        if (changeMoney !== null) return;
        setPaymentZoneMoney(prev => [...prev, { ...money }]);
      };

      const removeFromPaymentZone = (index) => {
        if (changeMoney !== null) return;
        setPaymentZoneMoney(prev => prev.filter((_, i) => i !== index));
      };

      const resetGame = () => {
        setCart([]);
        setScreen('SHOP');
        setPaymentZoneMoney([]);
        setChangeMoney(null);
        setFeedbackMessage("");
        setShopkeeperState('IDLE');
      };

      const renderShopScreen = () => (
        <div className="h-full w-full flex flex-col relative overflow-hidden bg-[#FFF8E7]">
          <div className="absolute top-0 left-0 w-full h-[65%] bg-[#FFF8E7] z-0 shadow-[0_20px_50px_rgba(0,0,0,0.1)_inset]"></div>
          <div className="absolute bottom-0 left-0 w-full h-[35%] bg-tiled-floor z-0 origin-bottom transform perspective-[1000px] rotate-x-[15deg] scale-110 border-t-4 border-[#E0C097]"></div>
          <header className="absolute top-0 w-full bg-white/90 backdrop-blur-sm p-3 md:p-4 shadow-md flex justify-between items-center z-50 border-b-4 border-slate-200">
            <h1 className="text-xl md:text-2xl font-black text-slate-700 tracking-widest flex items-center gap-2">
              <span className="text-3xl">🏪</span> 快樂便利商店
            </h1>
            {cart.length > 0 && (
                <button 
                  onClick={() => setScreen('CHECKOUT')}
                  className="bg-green-500 hover:bg-green-600 text-white text-lg md:text-xl font-bold py-2 px-6 rounded-full shadow-[0_4px_0_rgb(21,128,61)] active:shadow-none active:translate-y-1 transition-all animate-bounce"
                >
                  去結帳 ➡️
                </button>
            )}
          </header>
          <div className="relative z-10 w-full h-full flex flex-col items-center justify-center pt-16 md:pt-20 pb-12 pointer-events-none">
            <div className="pointer-events-auto w-[90%] max-w-5xl bg-slate-800 rounded-t-xl border-x-[12px] border-t-[12px] border-slate-900 shadow-[0_30px_60px_rgba(0,0,0,0.5)] flex flex-col pt-0 px-0 z-20 relative transform transition-transform hover:scale-[1.01]">
               <div className="absolute -top-6 left-[-12px] right-[-12px] h-6 bg-slate-700 skew-x-[45deg] origin-bottom-left rounded-t-sm shadow-md z-[-1]"></div>
               <div className="flex flex-col bg-white">
                  <div className="relative h-44 md:h-56 border-b-[8px] border-slate-300 flex bg-gray-50">
                     <div className="absolute top-0 left-0 w-full h-4 bg-black/10 z-0"></div>
                     <div className="absolute bottom-0 left-0 w-full h-6 bg-blue-900/10 border-t border-blue-200"></div>
                     <div className="w-full h-full grid grid-cols-6 gap-2 px-4 items-end pb-4 z-10">
                        {PRODUCTS.slice(0, 6).map(p => (
                          <div key={p.id} className="h-full flex items-end justify-center">
                            <ProductCard product={p} onAdd={handleAddToCart} />
                          </div>
                        ))}
                     </div>
                  </div>
                  <div className="relative h-44 md:h-56 border-b-[20px] border-slate-800 flex bg-gray-50">
                     <div className="absolute top-0 left-0 w-full h-4 bg-black/10 z-0"></div>
                     <div className="absolute bottom-0 left-0 w-full h-6 bg-blue-900/10 border-t border-blue-200"></div>
                     <div className="w-full h-full grid grid-cols-6 gap-2 px-4 items-end pb-4 z-10">
                        {PRODUCTS.slice(6, 12).map(p => (
                          <div key={p.id} className="h-full flex items-end justify-center">
                            <ProductCard product={p} onAdd={handleAddToCart} />
                          </div>
                        ))}
                     </div>
                  </div>
               </div>
               <div className="absolute -bottom-8 left-4 w-6 h-8 bg-slate-900 rounded-b-lg"></div>
               <div className="absolute -bottom-8 right-4 w-6 h-8 bg-slate-900 rounded-b-lg"></div>
            </div>
          </div>
          <div className="absolute bottom-4 left-4 md:bottom-8 md:left-12 z-50 pointer-events-auto origin-bottom-left transform scale-[0.6] md:scale-75 transition-all hover:scale-[0.65] md:hover:scale-[0.8]">
              <div className="absolute bottom-2 left-4 w-[80%] h-8 bg-black/20 blur-md rounded-[100%] z-[-1]"></div>
              <ShoppingCart items={cart} />
          </div>
        </div>
      );

      const renderCheckoutScreen = () => (
        <div className="h-full w-full flex bg-[#FFF8E7] overflow-hidden relative">
          <div className="absolute inset-0 z-0 bg-[#FFF8E7] shadow-[inset_0_0_100px_rgba(0,0,0,0.1)]"></div>
          <div className="absolute bottom-0 w-full h-[35%] bg-tiled-floor z-0 border-t-4 border-[#E0C097] origin-bottom transform perspective-[1000px] rotate-x-[10deg] scale-110"></div>
          <div className="relative z-30 w-1/4 h-full pl-6 pt-12 flex flex-col items-center justify-start gap-4 pb-8">
             <button 
               onClick={() => setScreen('SHOP')}
               className="absolute top-4 left-4 bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 px-4 rounded-full shadow-md z-50 text-sm font-bold flex items-center gap-1 transition-colors"
             >
               ⬅️ 返回商品
             </button>
             <div 
                onClick={() => setIsWalletOpen(!isWalletOpen)}
                className={`transition-all duration-500 ease-in-out relative z-30 cursor-pointer -mt-6`}
             >
                {!isWalletOpen ? (
                    <div className="w-32 h-44 bg-[#5D4037] rounded-xl border-4 border-[#3E2723] shadow-2xl flex flex-col items-center justify-center relative transform hover:scale-105 transition-transform hover:-rotate-2 group">
                        <div className="absolute inset-2 border-2 border-dashed border-[#8D6E63]/30 rounded-lg"></div>
                        <div className="absolute top-0 w-full h-1/3 bg-[#4E342E] rounded-b-xl border-b-4 border-[#271a17] shadow-md group-hover:h-[35%] transition-all"></div>
                        <div className="absolute top-[28%] w-5 h-5 bg-yellow-400 rounded-full border-2 border-yellow-600 shadow-sm z-10 flex items-center justify-center">
                            <div className="w-2 h-2 bg-yellow-200 rounded-full opacity-70"></div>
                        </div>
                        <span className="mt-10 text-white font-bold text-2xl drop-shadow-md tracking-wider">錢包</span>
                        <div className="mt-2 bg-[#8D6E63] text-white text-[10px] px-2 py-0.5 rounded-full animate-pulse">點擊打開</div>
                    </div>
                ) : (
                    <div className="bg-[#A1887F] p-3 rounded-lg border-r-[8px] border-b-[8px] border-[#5D4037] border-t-2 border-l-2 border-[#D7CCC8] shadow-[10px_10px_20px_rgba(0,0,0,0.3)] flex flex-col items-center gap-3 w-32 relative animate-[fadeIn_0.3s_ease-out]">
                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-[90%] h-4 bg-[#5D4037] rounded-full shadow-sm"></div>
                        <div className="bg-[#5D4037] text-white px-2 py-1 rounded text-xs font-bold w-full text-center shadow-[inset_0_2px_4px_rgba(0,0,0,0.3)] z-10 mt-1 border-b border-white/20">點擊收起</div>
                        {CURRENCY.map((money) => (
                            <div key={money.value} className="relative transition-transform active:scale-95 cursor-pointer hover:-translate-y-1"
                                 onClick={(e) => {
                                     e.stopPropagation();
                                     addToPaymentZone(money);
                                 }}>
                            <Money info={money} className="shadow-md" />
                            </div>
                        ))}
                    </div>
                )}
             </div>
             <div className="mt-auto scale-[0.55] origin-bottom-left md:scale-75 relative top-6 left-2">
                <div className="absolute bottom-2 left-4 w-[80%] h-8 bg-black/20 blur-md rounded-[100%] z-[-1]"></div>
                <ShoppingCart items={cart} />
             </div>
          </div>
          <div className="relative z-10 flex-1 h-full flex flex-col justify-end">
             <div className="absolute bottom-[60%] left-[55%] -translate-x-1/2 z-0">
                 <Shopkeeper state={shopkeeperState} />
                 {feedbackMessage && (
                    <div className="absolute bottom-[85%] left-[65%] w-48 md:w-56 bg-white border-4 border-slate-700 p-3 md:p-4 rounded-2xl rounded-bl-none shadow-[4px_4px_0px_rgba(0,0,0,0.2)] z-50 animate-bounce text-center origin-bottom-left transform rotate-1">
                        <p className="font-bold text-xl text-slate-900 mb-2 whitespace-nowrap">{feedbackMessage}</p>
                        {changeMoney !== null && (
                            <button onClick={resetGame} className="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-1.5 rounded-full font-bold shadow-md active:translate-y-0.5 transition-all flex items-center justify-center gap-1 mx-auto whitespace-nowrap">
                            下一位顧客 ➡️
                            </button>
                        )}
                    </div>
                 )}
             </div>
             <div className="h-[55%] mb-[60px] bg-[#A1887F] border-t-[20px] border-[#6D4C41] w-full flex relative shadow-[0_30px_50px_rgba(0,0,0,0.4)] px-8 items-start pt-8 justify-between z-20 rounded-b-xl">
                <div className="absolute top-[-20px] left-0 w-full h-[5px] bg-[#D7CCC8]/30"></div>
                <div className="absolute -bottom-[60px] left-20 w-8 h-[60px] bg-[#5D4037] -z-10"></div>
                <div className="absolute -bottom-[60px] right-20 w-8 h-[60px] bg-[#5D4037] -z-10"></div>
                <div className="absolute -top-[7.5rem] left-10 w-48 z-20 group">
                   <div className="w-full bg-slate-700 rounded-lg p-3 border-b-[12px] border-r-[12px] border-slate-900 shadow-2xl transform transition-transform group-hover:-translate-y-1">
                      <div className="bg-[#1a1a1a] p-2 rounded mb-3 border-4 border-slate-500 shadow-[inset_0_0_10px_rgba(0,255,0,0.2)]">
                         <div className="text-green-400 font-mono text-right text-3xl font-bold drop-shadow-md glow">${calculateTotal()}</div>
                      </div>
                      <div className="grid grid-cols-3 gap-2">
                         {[...Array(9)].map((_, i) => <div key={i} className="h-4 bg-slate-600 rounded shadow-[0_2px_0_rgba(0,0,0,0.5)] active:shadow-none active:translate-y-[2px]"></div>)}
                      </div>
                   </div>
                   <div className="w-[100%] ml-[6px] h-12 bg-[#8D6E63] border-b-[6px] border-r-[6px] border-[#5D4037] rounded-b mt-[-2px] shadow-lg flex items-center justify-center relative z-[-1]">
                       <div className="w-32 h-2 bg-[#3E2723] rounded-full opacity-50 shadow-[inset_0_1px_2px_rgba(0,0,0,0.5)]"></div>
                   </div>
                </div>
                <div className="w-48 flex-shrink-0"></div>
                <div className="flex-1 flex justify-around items-start h-full max-w-4xl z-10 pl-12 md:pl-20">
                    <div className="relative group transition-transform hover:scale-[1.02] h-[92%]">
                        <div className="absolute -top-12 left-8 w-1 h-12 bg-[#5D4037] shadow-sm"></div>
                        <div className="absolute -top-12 right-8 w-1 h-12 bg-[#5D4037] shadow-sm"></div>
                        <div className="absolute -top-12 left-[1.85rem] w-3 h-3 bg-black rounded-full z-10 shadow-sm border border-gray-600"></div>
                        <div className="absolute -top-12 right-[1.85rem] w-3 h-3 bg-black rounded-full z-10 shadow-sm border border-gray-600"></div>
                        <div className="w-80 md:w-96 h-full bg-[#D7CCC8] border-[6px] border-[#8D6E63] rounded-lg shadow-[0_10px_20px_rgba(0,0,0,0.3)] flex flex-col relative bg-[url('https://www.transparenttextures.com/patterns/wood-pattern.png')]">
                            <div className="absolute bottom-[-6px] right-[-6px] w-full h-full bg-[#5D4037] rounded-lg -z-10"></div>
                            <div className="bg-[#8D6E63] text-white text-center font-bold py-2 border-b-4 border-[#5D4037] flex justify-between px-4 text-lg shadow-sm">
                               <span className="drop-shadow-sm">付錢區域</span>
                               <span className="text-yellow-300 font-mono drop-shadow-md bg-black/20 px-2 rounded">${calculatePaymentTotal()}</span>
                            </div>
                            <div className="flex-1 flex flex-wrap content-start justify-center gap-2 p-2 overflow-y-auto scrollbar-hide pb-20">
                                {paymentZoneMoney.length === 0 && (
                                    <div className="absolute inset-0 flex items-center justify-center opacity-30 pointer-events-none">
                                        <span className="text-6xl grayscale">💸</span>
                                    </div>
                                )}
                                {paymentZoneMoney.map((m, i) => (
                                    <div key={i} onClick={() => removeFromPaymentZone(i)} className="hover:scale-110 transition-transform relative shrink-0 z-10">
                                        <Money info={m} className="scale-75 shadow-lg" />
                                    </div>
                                ))}
                            </div>
                            <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 w-full flex justify-center">
                               <button 
                                 onClick={handlePayment} 
                                 disabled={paymentZoneMoney.length === 0}
                                 className="bg-green-600 hover:bg-green-500 text-white font-black text-2xl px-10 py-3 rounded-xl border-b-[6px] border-green-900 shadow-xl active:border-b-0 active:translate-y-[6px] transition-all disabled:bg-gray-400 disabled:border-gray-600 disabled:cursor-not-allowed disabled:active:translate-y-0"
                               >
                                 付錢
                               </button>
                            </div>
                        </div>
                    </div>
                    <div className="relative transition-transform hover:scale-[1.02] h-[92%]">
                        <div className="absolute -top-12 left-8 w-1 h-12 bg-[#5D4037] shadow-sm"></div>
                        <div className="absolute -top-12 right-8 w-1 h-12 bg-[#5D4037] shadow-sm"></div>
                        <div className="absolute -top-12 left-[1.85rem] w-3 h-3 bg-black rounded-full z-10 shadow-sm border border-gray-600"></div>
                        <div className="absolute -top-12 right-[1.85rem] w-3 h-3 bg-black rounded-full z-10 shadow-sm border border-gray-600"></div>
                        <div className="w-80 md:w-96 h-full bg-[#D7CCC8] border-[6px] border-[#8D6E63] rounded-lg shadow-[0_10px_20px_rgba(0,0,0,0.3)] flex flex-col relative bg-[url('https://www.transparenttextures.com/patterns/wood-pattern.png')]">
                            <div className="absolute bottom-[-6px] right-[-6px] w-full h-full bg-[#5D4037] rounded-lg -z-10"></div>
                            <div className="bg-[#5D4037] text-white text-center font-bold py-2 border-b-4 border-[#3E2723] flex justify-between px-4 text-lg shadow-sm">
                               <span className="drop-shadow-sm">找錢區域</span>
                               <span className="text-yellow-300 font-mono drop-shadow-md bg-black/20 px-2 rounded">${calculateChangeTotal()}</span>
                            </div>
                            <div className="flex-1 flex flex-wrap content-start justify-center gap-2 p-2 overflow-y-auto scrollbar-hide">
                                 {changeMoney === null ? (
                                    <div className="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none">
                                        <span className="text-5xl">💰</span>
                                    </div>
                                ) : null}
                                {changeMoney && changeMoney.map((m, i) => (
                                    <div key={i} className="animate-[bounce_0.6s_ease-out] shrink-0 z-10">
                                        <Money info={m} className="scale-75 shadow-lg" />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
             </div>
          </div>
        </div>
      );

      return (
        <div className="h-full w-full">
          {screen === 'SHOP' ? renderShopScreen() : renderCheckoutScreen()}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
