<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中年級 水量測與重量實驗室</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            'fade-up': {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            'bounce-short': {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20%)' }
            }
          },
          animation: {
            'fade-up': 'fade-up 0.5s ease-out forwards',
            'bounce-short': 'bounce-short 0.5s ease-out'
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX/TSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-blue-100">
  <div id="root"></div>

  <script type="text/babel" data-presets="react,typescript">
    const { useState, useEffect } = React;

    // --- Icons (Lucide React equivalents) ---
    const IconBase = ({ children, size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const CheckCircle2 = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconBase>;
    const XCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></IconBase>;
    const ArrowRight = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>;
    const RotateCcw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconBase>;
    const Trophy = (props) => <IconBase {...props}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 1.1-.9 2-2 2H6"/><path d="M14 14.66V17c0 1.1.9 2 2 2h2"/><path d="M18 2H6v7c0 6 6 8 6 8s6-2 6-8V2Z"/></IconBase>;
    const Droplets = (props) => <IconBase {...props}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.9 7 2.9s-2.29 6.16-2.29 6.16C3.57 10 3 11.09 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 1 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></IconBase>;
    const Scale = (props) => <IconBase {...props}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></IconBase>;
    const Combine = (props) => <IconBase {...props}><rect width="8" height="8" x="2" y="2" rx="2"/><path d="M14 2c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2"/><path d="M20 2c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2"/><path d="M10 18H5c-1.7 0-3-1.3-3-3v-1"/><polyline points="7 21 10 18 7 15"/><rect width="8" height="8" x="14" y="14" rx="2"/></IconBase>;

    // --- App Component ---
    function App() {
      const [currentLevel, setCurrentLevel] = useState(1);
      const [isSuccess, setIsSuccess] = useState(false);

      // --- Level 1 State: Displacement ---
      const [l1StoneIn, setL1StoneIn] = useState(false);
      const [l1Input, setL1Input] = useState("");
      const [l1Feedback, setL1Feedback] = useState(null);

      // --- Level 2 State: Water Weight ---
      const [l2TargetWeight, setL2TargetWeight] = useState(0);
      const [l2CurrentWater, setL2CurrentWater] = useState(0);
      const [l2Tested, setL2Tested] = useState([]);
      const [l2Answer, setL2Answer] = useState(null);
      const [l2Feedback, setL2Feedback] = useState(null);

      // --- Level 3 State: Integrated Challenge ---
      const [l3Step, setL3Step] = useState(1);
      const [l3Q1Input, setL3Q1Input] = useState("");
      const [l3Q2Input, setL3Q2Input] = useState("");
      const [l3Q1Feedback, setL3Q1Feedback] = useState(null);
      const [l3Q2Feedback, setL3Q2Feedback] = useState(null);

      // --- Common Handlers ---
      const resetLevel = () => {
        setIsSuccess(false);
        if (currentLevel === 1) {
          setL1StoneIn(false);
          setL1Input("");
          setL1Feedback(null);
        } else if (currentLevel === 2) {
          setL2TargetWeight(0);
          setL2CurrentWater(0);
          setL2Tested([]);
          setL2Answer(null);
          setL2Feedback(null);
        } else {
          setL3Step(1);
          setL3Q1Input("");
          setL3Q2Input("");
          setL3Q1Feedback(null);
          setL3Q2Feedback(null);
        }
      };

      // --- Level 1 Logic ---
      const checkL1 = () => {
        if (l1Input === "150") {
          setL1Feedback("correct");
          setIsSuccess(true);
        } else {
          setL1Feedback("wrong");
        }
      };

      // --- Level 2 Logic ---
      const checkL2 = (choice) => {
        setL2Answer(choice);
        if (choice === "A") {
          setL2Feedback("correct");
          setIsSuccess(true);
        } else {
          setL2Feedback("wrong");
        }
      };

      // --- Level 3 Logic ---
      const checkL3Q1 = () => {
        if (l3Q1Input === "150") {
          setL3Q1Feedback("correct");
          setTimeout(() => setL3Step(2), 1000);
        } else {
          setL3Q1Feedback("wrong");
        }
      };

      const checkL3Q2 = () => {
        if (l3Q2Input === "150") {
          setL3Q2Feedback("correct");
          setIsSuccess(true);
        } else {
          setL3Q2Feedback("wrong");
        }
      };

      // --- Drag & Drop Handlers ---
      const handleDragStart = (e, data) => {
        e.dataTransfer.setData("application/json", JSON.stringify(data));
      };

      const handleDrop = (e, target) => {
        e.preventDefault();
        try {
          const data = JSON.parse(e.dataTransfer.getData("application/json"));
          if (target === 'beaker' && data.type === 'stone') {
            setL1StoneIn(true);
          } else if (target === 'scale' && data.type === 'weight') {
            setL2TargetWeight(data.weight);
            setL2CurrentWater(0); // Reset water when new weight is placed
          }
        } catch (err) {}
      };

      const addL2Water = (amount) => {
        setL2CurrentWater(prev => Math.min(600, prev + amount));
      };

      useEffect(() => {
        if (l2TargetWeight > 0 && l2TargetWeight === l2CurrentWater) {
          if (!l2Tested.includes(l2TargetWeight)) {
            setL2Tested(prev => [...prev, l2TargetWeight]);
          }
        }
      }, [l2TargetWeight, l2CurrentWater, l2Tested]);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-blue-100">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <div>
              <h1 className="text-xl font-bold text-blue-900">中年級 水量測與重量實驗室</h1>
              <div className="flex gap-2 mt-1">
                {[1, 2, 3].map(lvl => (
                  <div 
                    key={lvl}
                    className={`h-1.5 w-8 rounded-full transition-all ${currentLevel >= lvl ? 'bg-blue-500' : 'bg-slate-200'}`}
                  />
                ))}
              </div>
            </div>
            <div className="flex items-center gap-4">
              <span className="text-sm font-medium text-slate-500">關卡 {currentLevel} / 3</span>
              <button 
                onClick={resetLevel}
                className="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-400 hover:text-slate-600"
                title="重置本關"
              >
                <RotateCcw size={20} />
              </button>
            </div>
          </header>

          <main className="max-w-5xl mx-auto p-6">
            
            {/* Level 1: Displacement */}
            {currentLevel === 1 && (
              <div className="animate-fade-up">
                <div className="flex items-center gap-3 mb-8">
                  <div className="bg-blue-100 p-2 rounded-lg text-blue-600"><Droplets size={24} /></div>
                  <h2 className="text-2xl font-bold">第一關：排水測體積</h2>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-12 items-start">
                  {/* Lab Area */}
                  <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center">
                    {/* Beaker Container (Max 600mL) - Fixed height for precision */}
                    <div className="relative w-48 h-[400px] border-x-4 border-b-4 border-slate-300 rounded-b-2xl bg-slate-50/50 overflow-hidden"
                         onDragOver={e => e.preventDefault()}
                         onDrop={e => handleDrop(e, 'beaker')}>
                      
                      {/* Water - Height calculated as (current / 600) * 100% */}
                      <div 
                        className="w-full bg-blue-400/60 transition-all duration-1000 ease-in-out absolute bottom-0 left-0 right-0 flex items-end justify-center"
                        style={{ height: l1StoneIn ? '91.666%' : '66.666%' }}
                      >
                        {/* Water Surface Line - For perfect alignment visibility */}
                        <div className="absolute top-0 left-0 right-0 h-[2px] bg-blue-500/60 shadow-[0_0_8px_rgba(59,130,246,0.6)] -translate-y-1/2"></div>
                        
                        <div className="absolute top-0 left-0 right-0 h-1 bg-white/30"></div>
                        {l1StoneIn && (
                          <div className="w-16 h-16 bg-stone-500 rounded-xl shadow-inner mb-4 animate-bounce-short" />
                        )}
                      </div>

                      {/* Scale Marks - Absolute positioned to match water logic (0-600mL) */}
                      <div className="absolute inset-0 pointer-events-none">
                        {[100, 200, 300, 400, 500, 600].map(m => (
                          <div 
                            key={m} 
                            className="absolute left-0 right-0 flex items-center translate-y-1/2"
                            style={{ bottom: `${(m / 600) * 100}%` }}
                          >
                            <div className="w-8 h-[2px] bg-slate-400"></div>
                            <span className="text-xs font-mono font-bold text-slate-500 ml-2 leading-none">{m} mL</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="mt-8 flex flex-col items-center">
                      <p className="text-sm text-slate-500 mb-4 font-medium">請將石頭拖入量筒中</p>
                      {!l1StoneIn && (
                        <div 
                          draggable
                          onDragStart={e => handleDragStart(e, { type: 'stone' })}
                          className="w-20 h-20 bg-stone-500 rounded-2xl shadow-lg cursor-grab active:cursor-grabbing hover:scale-110 transition-transform flex items-center justify-center text-white font-bold text-lg"
                        >
                          石頭
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Question Area */}
                  <div className="space-y-6">
                    <div className="bg-blue-50 p-6 rounded-2xl border border-blue-100">
                      <p className="text-blue-800 font-medium mb-2">觀察實驗結果：</p>
                      <div className="flex items-center gap-4 text-xl font-mono font-bold text-blue-900">
                        <span>原本 400 mL</span>
                        <ArrowRight size={20} className="text-blue-400" />
                        <span className={l1StoneIn ? 'text-blue-600' : 'text-slate-400'}>
                          現在 {l1StoneIn ? '550' : '???'} mL
                        </span>
                      </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                      <h3 className="font-bold mb-4">任務提問：</h3>
                      <p className="text-slate-600 mb-4">根據水位的變化，這顆石頭的體積是多少？</p>
                      <div className="flex gap-3">
                        <div className="relative flex-1">
                          <input 
                            type="number"
                            value={l1Input}
                            onChange={e => setL1Input(e.target.value)}
                            placeholder="輸入數值"
                            disabled={isSuccess}
                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all font-mono text-lg"
                          />
                          <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">mL</span>
                        </div>
                        <button 
                          onClick={checkL1}
                          disabled={!l1StoneIn || !l1Input || isSuccess}
                          className="px-6 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-md shadow-blue-200"
                        >
                          驗證
                        </button>
                      </div>

                      {l1Feedback && (
                        <div className={`mt-4 flex items-center gap-2 font-medium animate-fade-up ${l1Feedback === 'correct' ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {l1Feedback === 'correct' ? (
                            <><CheckCircle2 size={20} /> 太棒了！體積就是排開的水量。</>
                          ) : (
                            <><XCircle size={20} /> 再算算看，550 - 400 等於多少？</>
                          )}
                        </div>
                      )}
                    </div>

                    {isSuccess && (
                      <button 
                        onClick={() => { setCurrentLevel(2); setIsSuccess(false); }}
                        className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold text-lg hover:bg-emerald-700 transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-100"
                      >
                        進入下一關 <ArrowRight size={20} />
                      </button>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* Level 2: Water Weight */}
            {currentLevel === 2 && (
              <div className="animate-fade-up">
                <div className="flex items-center gap-3 mb-8">
                  <div className="bg-amber-100 p-2 rounded-lg text-amber-600"><Scale size={24} /></div>
                  <h2 className="text-2xl font-bold">第二關：水的重量</h2>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                  {/* Lab Area */}
                  <div className="lg:col-span-7 xl:col-span-8 bg-white p-8 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center">
                    
                    {/* Balance Scale */}
                    <div className="relative w-full max-w-2xl h-[450px] mt-4 flex flex-col items-center">
                      {/* Stand */}
                      <div className="absolute bottom-0 w-8 h-[350px] bg-slate-600 rounded-t-full z-0 shadow-inner"></div>
                      <div className="absolute bottom-0 w-64 h-10 bg-slate-700 rounded-t-3xl z-0 shadow-lg"></div>
                      
                      {/* Pivot */}
                      <div className="absolute top-[85px] w-12 h-12 bg-slate-700 rounded-full z-20 shadow-md border-4 border-slate-300 flex items-center justify-center">
                        <div className="w-3 h-3 bg-slate-400 rounded-full"></div>
                      </div>

                      {/* Beam */}
                      <div 
                        className="absolute top-[105px] w-[500px] h-4 bg-slate-600 z-10 transition-transform duration-700 ease-out origin-center rounded-full shadow-md"
                        style={{ transform: `rotate(${Math.max(-20, Math.min(20, (l2TargetWeight - l2CurrentWater) * 0.1))}deg)` }}
                      >
                        {/* Left Pan (Hanging Beaker) */}
                        <div className="absolute left-0 top-2 w-48 -translate-x-1/2 flex flex-col items-center" style={{ transform: `rotate(${-Math.max(-20, Math.min(20, (l2TargetWeight - l2CurrentWater) * 0.1))}deg)`, transformOrigin: 'top center' }}>
                          {/* Strings */}
                          <svg className="w-40 h-32 overflow-visible z-10" viewBox="0 0 160 128">
                            <line x1="80" y1="0" x2="0" y2="128" stroke="#64748b" strokeWidth="3" />
                            <line x1="80" y1="0" x2="160" y2="128" stroke="#64748b" strokeWidth="3" />
                            <circle cx="80" cy="0" r="6" fill="#475569" />
                          </svg>
                          
                          {/* Beaker */}
                          <div className="relative w-40 h-40 border-4 border-t-0 border-slate-400 rounded-b-2xl bg-white/40 shadow-sm mt-[-2px]">
                            {/* Beaker Rim */}
                            <div className="absolute top-[-8px] left-[-10px] right-[-10px] h-4 border-4 border-slate-400 rounded-[50%] bg-white/60 z-20"></div>
                            
                            {/* Water */}
                            <div className="absolute bottom-0 left-0 right-0 bg-blue-400/60 transition-all duration-300 rounded-b-xl" style={{ height: `${(l2CurrentWater / 600) * 100}%` }}>
                               {/* Water Surface */}
                               {l2CurrentWater > 0 && (
                                 <div className="absolute top-0 left-0 right-0 h-4 bg-blue-500/50 -translate-y-1/2 rounded-[50%] border border-blue-400/50"></div>
                               )}
                            </div>
                            <div className="absolute inset-0 flex items-center justify-center text-xl font-bold text-blue-900 z-10 drop-shadow-md">{l2CurrentWater} mL</div>
                          </div>
                        </div>

                        {/* Right Pan (Hanging Pan) */}
                        <div 
                          className="absolute right-0 top-2 w-48 translate-x-1/2 flex flex-col items-center" 
                          style={{ transform: `rotate(${-Math.max(-20, Math.min(20, (l2TargetWeight - l2CurrentWater) * 0.1))}deg)`, transformOrigin: 'top center' }}
                          onDragOver={e => e.preventDefault()}
                          onDrop={e => handleDrop(e, 'scale')}
                        >
                          {/* Strings */}
                          <svg className="w-40 h-32 overflow-visible z-10 pointer-events-none" viewBox="0 0 160 128">
                            <line x1="80" y1="0" x2="0" y2="128" stroke="#64748b" strokeWidth="3" />
                            <line x1="80" y1="0" x2="160" y2="128" stroke="#64748b" strokeWidth="3" />
                            <circle cx="80" cy="0" r="6" fill="#475569" />
                          </svg>
                          
                          {/* Pan */}
                          <div className="w-40 h-6 bg-slate-400 rounded-b-full shadow-md relative flex justify-center mt-[-2px] border-t-2 border-slate-300">
                            {/* Weight */}
                            {l2TargetWeight > 0 ? (
                              <div className="absolute bottom-2 w-24 h-24 bg-zinc-600 rounded-2xl shadow-md border-2 border-black/20 flex items-center justify-center text-white font-bold text-2xl cursor-pointer hover:bg-zinc-500 transition-colors" onClick={() => { setL2TargetWeight(0); setL2CurrentWater(0); }} title="點擊移除">
                                {l2TargetWeight}g
                              </div>
                            ) : (
                              <div className="absolute bottom-4 mb-2 text-sm text-slate-500 font-medium bg-white/50 px-4 py-2 rounded-lg whitespace-nowrap pointer-events-none">放重物</div>
                            )}
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Status */}
                    <div className="mt-4 h-8 flex items-center justify-center">
                      {l2TargetWeight > 0 && l2TargetWeight === l2CurrentWater ? (
                        <span className="text-emerald-600 font-bold bg-emerald-50 px-4 py-1 rounded-full animate-fade-up">✨ 天平平衡！</span>
                      ) : l2TargetWeight > 0 ? (
                        <span className="text-slate-500 font-medium">
                          {l2TargetWeight > l2CurrentWater ? '右側較重，請加水' : '左側較重，水太多了'}
                        </span>
                      ) : (
                        <span className="text-slate-500 font-medium">請先將重物放上右側秤盤</span>
                      )}
                    </div>

                    {/* Controls */}
                    <div className="mt-8 w-full flex flex-col xl:flex-row gap-6 justify-center">
                      {/* Water Controls */}
                      <div className="bg-blue-50 p-5 rounded-2xl flex flex-col items-center flex-1">
                        <p className="text-sm text-blue-800 font-bold mb-3">左側：加水控制</p>
                        <div className="flex flex-wrap justify-center gap-2">
                          <button onClick={() => addL2Water(10)} disabled={l2TargetWeight === 0} className="px-4 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600 disabled:opacity-50 font-bold shadow-sm">+10 mL</button>
                          <button onClick={() => addL2Water(50)} disabled={l2TargetWeight === 0} className="px-4 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600 disabled:opacity-50 font-bold shadow-sm">+50 mL</button>
                          <button onClick={() => addL2Water(100)} disabled={l2TargetWeight === 0} className="px-4 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600 disabled:opacity-50 font-bold shadow-sm">+100 mL</button>
                          <button onClick={() => setL2CurrentWater(0)} disabled={l2TargetWeight === 0} className="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl hover:bg-slate-300 disabled:opacity-50 font-bold shadow-sm">倒空</button>
                        </div>
                      </div>

                      {/* Weights Shelf */}
                      <div className="bg-zinc-50 p-5 rounded-2xl flex flex-col items-center flex-1">
                        <p className="text-sm text-zinc-600 font-bold mb-3">右側：拖曳重物至秤盤</p>
                        <div className="flex gap-4">
                          {[100, 200, 500].map(w => (
                            <div 
                              key={w}
                              draggable={l2TargetWeight !== w}
                              onDragStart={e => handleDragStart(e, { type: 'weight', weight: w })}
                              className={`w-16 h-16 rounded-xl shadow-md flex items-center justify-center text-white font-bold text-base transition-all ${
                                l2TargetWeight === w 
                                  ? 'bg-zinc-400 cursor-not-allowed opacity-50 scale-95' 
                                  : 'bg-zinc-600 cursor-grab active:cursor-grabbing hover:scale-110'
                              }`}
                            >
                              {w}g
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Question Area */}
                  <div className="lg:col-span-5 xl:col-span-4 space-y-6">
                    <div className="bg-amber-50 p-6 rounded-2xl border border-amber-100">
                      <h3 className="font-bold text-amber-900 mb-4">測量紀錄：</h3>
                      <div className="space-y-2">
                        {[100, 200, 500].map(w => (
                          <div key={w} className="flex items-center justify-between bg-white/50 px-4 py-2 rounded-lg">
                            <span className="font-medium">{w} g 的重物</span>
                            <div className="flex items-center gap-2">
                              <ArrowRight size={14} className="text-slate-400" />
                              <span className={`font-mono font-bold ${l2Tested.includes(w) ? 'text-amber-600' : 'text-slate-300'}`}>
                                {l2Tested.includes(w) ? `需要 ${w} mL 水` : '尚未平衡'}
                              </span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                      <h3 className="font-bold mb-4">任務提問：</h3>
                      <p className="text-slate-600 mb-6">根據天平平衡的結果，1 mL 的水重量是多少？</p>
                      
                      <div className="grid grid-cols-1 gap-3">
                        {[
                          { id: 'A', text: '1 g' },
                          { id: 'B', text: '10 g' },
                          { id: 'C', text: '100 g' }
                        ].map(opt => (
                          <button 
                            key={opt.id}
                            onClick={() => checkL2(opt.id)}
                            disabled={l2Tested.length < 3 || isSuccess}
                            className={`p-4 rounded-xl border-2 text-left transition-all flex items-center justify-between group
                              ${l2Answer === opt.id 
                                ? (opt.id === 'A' ? 'border-emerald-500 bg-emerald-50' : 'border-rose-500 bg-rose-50')
                                : 'border-slate-100 hover:border-blue-200 hover:bg-blue-50'
                              }
                              ${l2Tested.length < 3 ? 'opacity-50 cursor-not-allowed' : ''}
                            `}
                          >
                            <span className="font-bold">{opt.id}. {opt.text}</span>
                            {l2Answer === opt.id && (
                              opt.id === 'A' ? <CheckCircle2 className="text-emerald-500" /> : <XCircle className="text-rose-500" />
                            )}
                          </button>
                        ))}
                      </div>

                      {l2Tested.length < 3 && (
                        <p className="mt-4 text-xs text-amber-600 font-medium italic">
                          * 請先完成三種重物 (100g, 200g, 500g) 的天平平衡測試再回答。
                        </p>
                      )}

                      {l2Feedback === 'correct' && (
                        <div className="mt-6 p-4 bg-emerald-100 rounded-xl text-emerald-800 font-bold animate-fade-up text-center">
                          🎯 結論：1 mL 的水重量剛好是 1 g！
                        </div>
                      )}
                    </div>

                    {isSuccess && (
                      <button 
                        onClick={() => { setCurrentLevel(3); setIsSuccess(false); }}
                        className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold text-lg hover:bg-emerald-700 transition-all flex items-center justify-center gap-2 shadow-lg shadow-emerald-100"
                      >
                        進入最終挑戰 <ArrowRight size={20} />
                      </button>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* Level 3: Integrated Challenge */}
            {currentLevel === 3 && (
              <div className="animate-fade-up">
                <div className="flex items-center gap-3 mb-8">
                  <div className="bg-indigo-100 p-2 rounded-lg text-indigo-600"><Combine size={24} /></div>
                  <h2 className="text-2xl font-bold">第三關：綜合挑戰</h2>
                </div>

                <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 mb-8">
                  <div className="flex flex-col md:flex-row gap-8 items-center justify-center">
                    <div className="bg-slate-50 p-6 rounded-2xl flex flex-col items-center border border-slate-100">
                      <div className="w-24 h-32 border-x-2 border-b-2 border-slate-300 rounded-b-lg bg-white relative overflow-hidden">
                        <div className="absolute bottom-0 w-full h-3/4 bg-blue-400/40"></div>
                        <div className="absolute bottom-2 left-1/2 -translate-x-1/2 w-10 h-10 bg-stone-500 rounded-lg"></div>
                      </div>
                      <p className="mt-4 text-sm font-bold text-slate-600">排水量 150 mL</p>
                    </div>
                    
                    <div className="text-slate-300 hidden md:block"><ArrowRight size={32} /></div>

                    <div className="bg-slate-50 p-6 rounded-2xl flex flex-col items-center border border-slate-100">
                      <div className="w-32 h-8 bg-slate-200 rounded-t-lg border-b-2 border-slate-300 flex items-center justify-center">
                        <span className="text-xs font-mono font-bold text-slate-400">? ? ? g</span>
                      </div>
                      <div className="w-24 h-8 bg-slate-300 rounded-b-xl"></div>
                      <p className="mt-4 text-sm font-bold text-slate-600">對應重量</p>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  {/* Question 1 */}
                  <div className={`p-8 rounded-3xl border-2 transition-all ${l3Step === 1 ? 'border-blue-500 bg-blue-50/30' : 'border-slate-100 bg-white opacity-50'}`}>
                    <div className="flex items-center gap-2 mb-4">
                      <span className="w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">1</span>
                      <h3 className="font-bold text-lg">體積判斷</h3>
                    </div>
                    <p className="text-slate-600 mb-6">石頭丟入水中，排水量為 150 mL。這顆石頭的體積是多少？</p>
                    <div className="flex gap-3">
                      <div className="relative flex-1">
                        <input 
                          type="number"
                          value={l3Q1Input}
                          onChange={e => setL3Q1Input(e.target.value)}
                          disabled={l3Step !== 1}
                          className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl outline-none font-mono"
                          placeholder="輸入 mL"
                        />
                        <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">mL</span>
                      </div>
                      <button 
                        onClick={checkL3Q1}
                        disabled={l3Step !== 1 || !l3Q1Input}
                        className="px-6 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 disabled:opacity-50"
                      >
                        驗證
                      </button>
                    </div>
                    {l3Q1Feedback && (
                      <div className={`mt-4 flex items-center gap-2 font-medium ${l3Q1Feedback === 'correct' ? 'text-emerald-600' : 'text-rose-600'}`}>
                        {l3Q1Feedback === 'correct' ? <CheckCircle2 size={18} /> : <XCircle size={18} />}
                        {l3Q1Feedback === 'correct' ? '正確！體積與排水量數值相同。' : '再想想，第一關學到的概念。'}
                      </div>
                    )}
                  </div>

                  {/* Question 2 */}
                  <div className={`p-8 rounded-3xl border-2 transition-all ${l3Step === 2 ? 'border-indigo-500 bg-indigo-50/30' : 'border-slate-100 bg-white opacity-50'}`}>
                    <div className="flex items-center gap-2 mb-4">
                      <span className="w-8 h-8 bg-indigo-600 text-white rounded-full flex items-center justify-center font-bold">2</span>
                      <h3 className="font-bold text-lg">重量轉換</h3>
                    </div>
                    <p className="text-slate-600 mb-6">如果排出來的這 150 mL 是一杯純水，把它拿去秤重，會重多少公克？</p>
                    <div className="flex gap-3">
                      <div className="relative flex-1">
                        <input 
                          type="number"
                          value={l3Q2Input}
                          onChange={e => setL3Q2Input(e.target.value)}
                          disabled={l3Step !== 2 || isSuccess}
                          className="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl outline-none font-mono"
                          placeholder="輸入 g"
                        />
                        <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">g</span>
                      </div>
                      <button 
                        onClick={checkL3Q2}
                        disabled={l3Step !== 2 || !l3Q2Input || isSuccess}
                        className="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 disabled:opacity-50"
                      >
                        驗證
                      </button>
                    </div>
                    {l3Q2Feedback && (
                      <div className={`mt-4 flex items-center gap-2 font-medium ${l3Q2Feedback === 'correct' ? 'text-emerald-600' : 'text-rose-600'}`}>
                        {l3Q2Feedback === 'correct' ? <CheckCircle2 size={18} /> : <XCircle size={18} />}
                        {l3Q2Feedback === 'correct' ? '太棒了！1 mL = 1 g，所以 150 mL = 150 g。' : '想一下第二關的測量結果。'}
                      </div>
                    )}
                  </div>
                </div>

                {isSuccess && (
                  <div className="mt-12 bg-emerald-600 p-8 rounded-3xl text-white text-center animate-fade-up shadow-xl shadow-emerald-200">
                    <div className="flex justify-center mb-4"><Trophy size={64} className="text-yellow-300" /></div>
                    <h2 className="text-3xl font-bold mb-2">恭喜完成所有挑戰！</h2>
                    <p className="text-emerald-100 mb-6">你已經掌握了體積、容量與重量的轉換關係。</p>
                    <button 
                      onClick={() => { setCurrentLevel(1); resetLevel(); }}
                      className="px-8 py-3 bg-white text-emerald-600 rounded-xl font-bold hover:bg-emerald-50 transition-all"
                    >
                      重新開始實驗
                    </button>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* Footer Info */}
          <footer className="max-w-5xl mx-auto px-6 py-12 text-center text-slate-400 text-sm">
            <p>108 課綱數學領域互動教具 (N-4-11, N-3-13)</p>
            <p className="mt-1">© 2026 水量測與重量實驗室</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
