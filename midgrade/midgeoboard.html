<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中年級 數位釘板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    /* Hide scrollbar for clean look */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { PenTool, Trash2, RefreshCw, Grid3X3, CheckCircle2, XCircle, BookOpen, Shapes } from 'https://esm.sh/lucide-react@0.292.0';

    // ==========================================
    // Types & Constants
    // ==========================================
    const ToolMode = {
      DRAW: 'DRAW',
      DELETE: 'DELETE',
      INSPECT: 'INSPECT'
    };
    
    const GRID_SIZE = 20;
    const DOT_SPACING = 30;
    const PADDING = 40;

    const SHAPE_COLORS = [
      '#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899',
    ];

    // ==========================================
    // Geometry Utils
    // ==========================================
    const calculateDistance = (p1, p2) => {
      return Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
    };

    const calculatePerimeter = (points) => {
      if (points.length < 2) return 0;
      let perimeter = 0;
      for (let i = 0; i < points.length; i++) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];
        perimeter += calculateDistance(p1, p2);
      }
      return parseFloat(perimeter.toFixed(2));
    };

    const calculateArea = (points) => {
      if (points.length < 3) return 0;
      let area = 0;
      for (let i = 0; i < points.length; i++) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];
        area += (p1.x * p2.y) - (p2.x * p1.y);
      }
      return parseFloat((Math.abs(area) / 2).toFixed(2));
    };

    const snapToGrid = (x, y, spacing) => {
      return {
        x: Math.round(x / spacing),
        y: Math.round(y / spacing)
      };
    };

    const getShapeName = (points) => {
      const v = points.length;
      if (v === 3) return "三角形";
      if (v === 4) return "四邊形";
      if (v === 5) return "五邊形";
      if (v === 6) return "六邊形";
      if (v === 8) return "八邊形";
      return `${v}邊形`;
    };

    const getShapeDimensions = (points) => {
      if (points.length < 3) return null;
      const horizontalEdges = [];
      for (let i = 0; i < points.length; i++) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];
        if (p1.y === p2.y) {
          horizontalEdges.push({
            p1, p2, y: p1.y, length: Math.abs(p2.x - p1.x), midX: (p1.x + p2.x) / 2
          });
        }
      }
      if (horizontalEdges.length === 0) return null;
      horizontalEdges.sort((a, b) => {
        if (Math.abs(b.length - a.length) > 0.1) return b.length - a.length;
        return b.y - a.y;
      });
      const baseEdge = horizontalEdges[0];
      let maxDist = -1;
      let topPoint = points[0];
      points.forEach(p => {
        const dist = Math.abs(p.y - baseEdge.y);
        if (dist > maxDist) {
          maxDist = dist;
          topPoint = p;
        }
      });
      if (maxDist < 0.1) return null;
      return {
        base: baseEdge,
        height: maxDist,
        topPoint: topPoint,
        heightLine: {
          x: topPoint.x,
          yStart: topPoint.y,
          yEnd: baseEdge.y
        }
      };
    };

    // ==========================================
    // Board Component
    // ==========================================
    const Board = ({ shapes, setShapes, mode }) => {
      const [activePoints, setActivePoints] = useState([]);
      const [hoverPoint, setHoverPoint] = useState(null);
      const svgRef = useRef(null);

      const gridToPixel = (val) => val * DOT_SPACING + PADDING;

      const handleSvgClick = (e) => {
        if (mode !== ToolMode.DRAW) return;
        if (!svgRef.current) return;
        
        const rect = svgRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left - PADDING;
        const y = e.clientY - rect.top - PADDING;

        const snapped = snapToGrid(x, y, DOT_SPACING);

        if (snapped.x < 0 || snapped.x > GRID_SIZE - 1 || snapped.y < 0 || snapped.y > GRID_SIZE - 1) return;

        if (activePoints.length > 2 && snapped.x === activePoints[0].x && snapped.y === activePoints[0].y) {
          const newShape = {
            id: Date.now().toString(),
            points: [...activePoints],
            color: SHAPE_COLORS[shapes.length % SHAPE_COLORS.length]
          };
          setShapes([...shapes, newShape]);
          setActivePoints([]);
        } else {
          if (activePoints.length > 0) {
            const last = activePoints[activePoints.length - 1];
            if (last.x === snapped.x && last.y === snapped.y) return;
          }
          setActivePoints([...activePoints, snapped]);
        }
      };

      const handleMouseMove = (e) => {
        if (!svgRef.current) return;
        const rect = svgRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left - PADDING;
        const y = e.clientY - rect.top - PADDING;
        const snapped = snapToGrid(x, y, DOT_SPACING);
        
        if (snapped.x >= 0 && snapped.x < GRID_SIZE && snapped.y >= 0 && snapped.y < GRID_SIZE) {
           setHoverPoint(snapped);
        } else {
           setHoverPoint(null);
        }
      };

      const handleShapeClick = (shapeId) => {
        if (mode === ToolMode.DELETE) {
          setShapes(shapes.filter(s => s.id !== shapeId));
        }
      };

      const dots = [];
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          dots.push({ x, y });
        }
      }

      const width = (GRID_SIZE - 1) * DOT_SPACING + PADDING * 2;
      const height = (GRID_SIZE - 1) * DOT_SPACING + PADDING * 2;

      return (
        <div className="relative bg-[#FFFDF5] rounded-xl shadow-lg border border-orange-100 overflow-hidden flex flex-col items-center justify-center p-4">
          <div className="mb-2 text-sm text-stone-500 font-medium">
            {mode === ToolMode.DRAW && activePoints.length === 0 && "點擊一個點開始繪製"}
            {mode === ToolMode.DRAW && activePoints.length > 0 && "點擊其他點，最後點擊起點來完成"}
            {mode === ToolMode.DELETE && "點擊圖形來刪除"}
            {mode === ToolMode.INSPECT && "滑鼠移到圖形上可查看詳細資訊"}
          </div>

          <svg
            ref={svgRef}
            width={width}
            height={height}
            className={`cursor-${mode === ToolMode.DRAW ? 'crosshair' : mode === ToolMode.DELETE ? 'pointer' : 'default'} touch-none select-none`}
            onClick={handleSvgClick}
            onMouseMove={handleMouseMove}
            onMouseLeave={() => setHoverPoint(null)}
          >
            <defs>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="2" stdDeviation="2" floodOpacity="0.3"/>
              </filter>
            </defs>

            {dots.map((dot, i) => (
              <circle
                key={i}
                cx={gridToPixel(dot.x)}
                cy={gridToPixel(dot.y)}
                r={3}
                className="fill-orange-200"
              />
            ))}

            {shapes.map((shape) => {
              const pathData = shape.points.map((p, i) => 
                `${i === 0 ? 'M' : 'L'} ${gridToPixel(p.x)} ${gridToPixel(p.y)}`
              ).join(' ') + ' Z';
              
              const dimensions = getShapeDimensions(shape.points);
              
              let centerX = 0;
              let centerY = 0;
              if (shape.points.length > 0) {
                centerX = shape.points.reduce((sum, p) => sum + p.x, 0) / shape.points.length;
                centerY = shape.points.reduce((sum, p) => sum + p.y, 0) / shape.points.length;
              }

              const area = calculateArea(shape.points);
              const perimeter = calculatePerimeter(shape.points);

              return (
                <g key={shape.id} onClick={(e) => { e.stopPropagation(); handleShapeClick(shape.id); }}>
                  <path
                    d={pathData}
                    fill={shape.color}
                    fillOpacity="0.3"
                    stroke={shape.color}
                    strokeWidth="4"
                    strokeLinejoin="round"
                    strokeLinecap="round"
                    filter="url(#shadow)"
                    className={`${mode === ToolMode.DELETE ? 'hover:stroke-red-600 hover:fill-red-200 cursor-pointer' : ''} transition-colors duration-200`}
                  />
                  
                  {shape.points.map((p, i) => (
                     <circle
                      key={`v-${i}`}
                      cx={gridToPixel(p.x)}
                      cy={gridToPixel(p.y)}
                      r={5}
                      fill={shape.color}
                      stroke="#FFFDF5"
                      strokeWidth="2"
                     />
                  ))}

                  {shape.points.length >= 3 && (
                    <g className="pointer-events-none">
                      <rect 
                        x={gridToPixel(centerX) - 30} 
                        y={gridToPixel(centerY) - 20} 
                        width="60" 
                        height="40" 
                        rx="4" 
                        fill="white" 
                        fillOpacity="0.8" 
                        stroke={shape.color}
                        strokeWidth="1"
                      />
                      <text
                        x={gridToPixel(centerX)}
                        y={gridToPixel(centerY) - 4}
                        className="text-[10px] fill-stone-700 font-bold font-mono"
                        textAnchor="middle"
                      >
                        面積: {area}
                      </text>
                      <text
                        x={gridToPixel(centerX)}
                        y={gridToPixel(centerY) + 10}
                        className="text-[10px] fill-stone-700 font-bold font-mono"
                        textAnchor="middle"
                      >
                        周長: {perimeter}
                      </text>
                    </g>
                  )}

                  {dimensions && (
                    <g className="pointer-events-none">
                      <line 
                        x1={gridToPixel(dimensions.heightLine.x)}
                        y1={gridToPixel(dimensions.heightLine.yStart)}
                        x2={gridToPixel(dimensions.heightLine.x)}
                        y2={gridToPixel(dimensions.heightLine.yEnd)}
                        stroke="black"
                        strokeWidth="1.5"
                        strokeDasharray="4,4"
                        opacity="0.6"
                      />
                      <text
                        x={gridToPixel(dimensions.heightLine.x) + 5}
                        y={gridToPixel((dimensions.heightLine.yStart + dimensions.heightLine.yEnd) / 2)}
                        className="text-[10px] fill-stone-600 font-bold"
                        dominantBaseline="middle"
                      >
                        高
                      </text>
                      <line 
                        x1={gridToPixel(dimensions.base.p1.x)}
                        y1={gridToPixel(dimensions.base.p1.y)}
                        x2={gridToPixel(dimensions.base.p2.x)}
                        y2={gridToPixel(dimensions.base.p2.y)}
                        stroke="black"
                        strokeWidth="2"
                        strokeOpacity="0.4"
                      />
                      <text
                        x={gridToPixel(dimensions.base.midX)}
                        y={gridToPixel(dimensions.base.y) + 20}
                        className="text-[10px] fill-stone-600 font-bold"
                        textAnchor="middle"
                      >
                        底
                      </text>
                    </g>
                  )}
                </g>
              );
            })}

            {activePoints.length > 0 && (
              <g>
                <polyline
                  points={activePoints.map(p => `${gridToPixel(p.x)},${gridToPixel(p.y)}`).join(' ')}
                  fill="none"
                  stroke="#78716c"
                  strokeWidth="3"
                  strokeDasharray="5,5"
                  className="pointer-events-none"
                />
                {hoverPoint && (
                  <line 
                    x1={gridToPixel(activePoints[activePoints.length - 1].x)}
                    y1={gridToPixel(activePoints[activePoints.length - 1].y)}
                    x2={gridToPixel(hoverPoint.x)}
                    y2={gridToPixel(hoverPoint.y)}
                    stroke="#a8a29e"
                    strokeWidth="2"
                    strokeDasharray="4,4"
                    className="pointer-events-none"
                  />
                )}
                {activePoints.map((p, i) => (
                  <circle
                    key={`active-${i}`}
                    cx={gridToPixel(p.x)}
                    cy={gridToPixel(p.y)}
                    r={6}
                    className="fill-stone-500"
                  />
                ))}
              </g>
            )}

            {hoverPoint && mode === ToolMode.DRAW && (
              <circle
                cx={gridToPixel(hoverPoint.x)}
                cy={gridToPixel(hoverPoint.y)}
                r={8}
                className="fill-orange-400 opacity-50 pointer-events-none animate-pulse"
              />
            )}
          </svg>
        </div>
      );
    };

    // ==========================================
    // App Component
    // ==========================================
    const App = () => {
      const [shapes, setShapes] = useState([]);
      const [mode, setMode] = useState(ToolMode.DRAW);
      const [appMode, setAppMode] = useState('TASK');
      const [history, setHistory] = useState([]);
      const [showReasoning, setShowReasoning] = useState(false);
      const [reasoningFeedback, setReasoningFeedback] = useState(null);

      useEffect(() => {
        if (appMode === 'TASK' && history.length === 3 && !showReasoning && !reasoningFeedback) {
          setShowReasoning(true);
        }
      }, [history.length, appMode]);

      const clearBoard = () => {
        if (window.confirm("你確定要清除整個釘板嗎？")) {
          setShapes([]);
        }
      };

      const handleModeSwitch = (newMode) => {
        if (newMode !== appMode) {
          if (shapes.length === 0 || window.confirm(`確定要切換到${newMode === 'FREE' ? '自由模式' : '探究任務'}嗎？這將會清除目前的釘板。`)) {
            setAppMode(newMode);
            setShapes([]);
            if (newMode === 'TASK') {
              setHistory([]);
              setShowReasoning(false);
              setReasoningFeedback(null);
            }
          }
        }
      };

      const handleRecordShape = () => {
        if (shapes.length === 0) return;
        const shape = shapes[shapes.length - 1];
        
        const newRecord = {
          id: Date.now().toString(),
          shapeName: getShapeName(shape.points),
          area: calculateArea(shape.points),
          perimeter: calculatePerimeter(shape.points),
          points: shape.points,
          color: shape.color
        };
        
        setHistory([...history, newRecord]);
        setShapes([]);
      };

      const handleReasoningAnswer = (isCorrect) => {
        if (isCorrect) {
          setReasoningFeedback({
            text: "答對了！當周長固定時，形狀越接近正方形（長寬越接近），面積會越大。",
            isCorrect: true
          });
        } else {
          setReasoningFeedback({
            text: "再觀察一下歷史紀錄，細長的圖形面積通常比較小喔！",
            isCorrect: false
          });
        }
      };

      return (
        <div className="flex h-screen bg-orange-50 text-stone-800 font-sans">
          
          <aside className="w-20 lg:w-24 bg-[#FFF8E1] border-r border-orange-200 flex flex-col items-center py-6 gap-6 z-10 shadow-sm">
            <div className="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center text-white mb-4 shadow-md">
              <Grid3X3 size={24} />
            </div>
            
            <div className="flex flex-col w-full px-2 gap-3">
              <button
                onClick={() => setMode(ToolMode.DRAW)}
                className={`flex flex-col items-center justify-center p-3 rounded-xl transition-all ${
                  mode === ToolMode.DRAW 
                    ? 'bg-orange-100 text-orange-800 shadow-inner ring-1 ring-orange-200' 
                    : 'text-stone-500 hover:bg-orange-50 hover:text-orange-600'
                }`}
              >
                <PenTool size={24} className="mb-1" />
                <span className="text-[10px] font-medium">繪製</span>
              </button>

              <button
                onClick={() => setMode(ToolMode.DELETE)}
                className={`flex flex-col items-center justify-center p-3 rounded-xl transition-all ${
                  mode === ToolMode.DELETE 
                    ? 'bg-red-100 text-red-800 shadow-inner ring-1 ring-red-200' 
                    : 'text-stone-500 hover:bg-red-50 hover:text-red-600'
                }`}
              >
                <Trash2 size={24} className="mb-1" />
                <span className="text-[10px] font-medium">刪除</span>
              </button>
              
              <div className="w-full h-px bg-orange-200 my-1"></div>

              <button
                onClick={clearBoard}
                className="flex flex-col items-center justify-center p-3 rounded-xl text-stone-500 hover:bg-orange-50 transition-all hover:text-orange-600"
              >
                <RefreshCw size={24} className="mb-1" />
                <span className="text-[10px] font-medium">清除</span>
              </button>

              <div className="w-full h-px bg-orange-200 my-1"></div>

              <button
                onClick={() => handleModeSwitch('FREE')}
                className={`flex flex-col items-center justify-center p-3 rounded-xl transition-all ${
                  appMode === 'FREE' 
                    ? 'bg-blue-100 text-blue-800 shadow-inner ring-1 ring-blue-200' 
                    : 'text-stone-500 hover:bg-blue-50 hover:text-blue-600'
                }`}
              >
                <Shapes size={24} className="mb-1" />
                <span className="text-[10px] font-medium">自由</span>
              </button>

              <button
                onClick={() => handleModeSwitch('TASK')}
                className={`flex flex-col items-center justify-center p-3 rounded-xl transition-all ${
                  appMode === 'TASK' 
                    ? 'bg-emerald-100 text-emerald-800 shadow-inner ring-1 ring-emerald-200' 
                    : 'text-stone-500 hover:bg-emerald-50 hover:text-emerald-600'
                }`}
              >
                <BookOpen size={24} className="mb-1" />
                <span className="text-[10px] font-medium">任務</span>
              </button>
            </div>
          </aside>

          <main className="flex-1 flex flex-col overflow-hidden relative">
            
            <div className="flex-1 flex flex-col items-center justify-start bg-orange-50 p-6 overflow-auto relative">
               
               <div className="w-full max-w-4xl flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                 <div>
                   <h1 className="text-2xl font-bold text-stone-800">數位釘板</h1>
                   <p className="text-stone-500 text-sm">{appMode === 'FREE' ? '自由探索幾何圖形' : '完成指定任務來探索幾何'}</p>
                 </div>
                 
                 {appMode === 'TASK' && (
                   <div className="bg-white p-4 rounded-xl shadow-sm border border-orange-200 flex-1 md:ml-8">
                     <h2 className="text-sm font-bold text-orange-800 mb-2 flex items-center gap-2">
                       <BookOpen size={16} />
                       探究任務：周長與面積的關係
                     </h2>
                     <ul className="text-stone-600 text-sm space-y-1 list-decimal list-inside">
                       <li>在釘板上畫出一個圖形，使其<strong className="text-orange-600">「周長」盡可能接近 30</strong>。</li>
                       <li>點擊下方的「紀錄此圖形」保存數據。</li>
                       <li>重複畫出<strong className="text-orange-600">三個「形狀不同」</strong>但周長都接近 30 的圖形，觀察面積變化。</li>
                     </ul>
                   </div>
                 )}
               </div>
               
               <div className="z-10 flex flex-col items-center">
                 <Board shapes={shapes} setShapes={setShapes} mode={mode} />
                 
                 {appMode === 'TASK' && (
                   <div className="h-14 mt-4 flex items-center justify-center">
                     {shapes.length > 0 && (
                       <button
                         onClick={handleRecordShape}
                         className="px-6 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-full shadow-md transition-all transform hover:scale-105 active:scale-95 flex items-center gap-2"
                       >
                         <CheckCircle2 size={18} />
                         紀錄此圖形
                       </button>
                     )}
                   </div>
                 )}
               </div>

               {appMode === 'FREE' && (
                 <div className="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 px-4 pb-4 mt-8">
                   {shapes.length === 0 ? (
                     <div className="col-span-full text-center text-stone-400 italic py-4 bg-[#FFF8E1]/50 rounded-lg border border-orange-100">
                       畫一個形狀來查看它的屬性
                     </div>
                   ) : (
                     shapes.map((shape, idx) => (
                       <div key={shape.id} className="bg-[#FFFDF5] p-3 rounded-lg shadow-sm border border-orange-100 flex flex-col border-l-4" style={{ borderLeftColor: shape.color }}>
                         <div className="flex justify-between items-center mb-1">
                           <span className="font-bold text-stone-700 text-sm">{getShapeName(shape.points)} <span className="text-xs font-normal text-stone-400">#{idx + 1}</span></span>
                         </div>
                         <div className="grid grid-cols-2 gap-2 text-xs">
                           <div className="bg-orange-50 p-1.5 rounded text-center">
                             <span className="block text-stone-500 uppercase text-[10px]">面積</span>
                             <span className="font-mono font-semibold text-orange-700">{calculateArea(shape.points)}</span>
                           </div>
                           <div className="bg-orange-50 p-1.5 rounded text-center">
                             <span className="block text-stone-500 uppercase text-[10px]">周長</span>
                             <span className="font-mono font-semibold text-orange-700">{calculatePerimeter(shape.points)}</span>
                           </div>
                         </div>
                       </div>
                     ))
                   )}
                 </div>
               )}

               {appMode === 'TASK' && (
                 <div className="w-full max-w-4xl mt-2 bg-white p-5 rounded-xl shadow-sm border border-orange-200">
                   <div className="flex justify-between items-center mb-4">
                     <h3 className="text-md font-bold text-stone-700 flex items-center gap-2">
                       歷史紀錄與比較 
                       <span className="bg-orange-100 text-orange-800 px-2 py-0.5 rounded-full text-xs">{history.length}/3</span>
                     </h3>
                     {history.length >= 3 && (
                       <button 
                         onClick={() => setShowReasoning(true)}
                         className="text-sm px-4 py-1.5 bg-orange-100 text-orange-700 font-medium rounded-lg hover:bg-orange-200 transition-colors"
                       >
                         開啟推理診斷
                       </button>
                     )}
                   </div>
                   
                   {history.length === 0 ? (
                     <div className="text-center text-stone-400 italic py-8 bg-stone-50 rounded-lg border border-dashed border-stone-200">
                       尚未有紀錄，請在上方畫出圖形並點擊「紀錄此圖形」
                     </div>
                   ) : (
                     <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                       {history.map((record, idx) => (
                         <div key={record.id} className="bg-[#FFFDF5] p-3 rounded-lg shadow-sm border border-orange-100 flex flex-col border-l-4" style={{ borderLeftColor: record.color }}>
                           <div className="flex justify-between items-center mb-3">
                             <span className="font-bold text-stone-700 text-sm">{record.shapeName} <span className="text-xs font-normal text-stone-400">#{idx + 1}</span></span>
                           </div>
                           <div className="grid grid-cols-2 gap-2 text-xs">
                             <div className="bg-orange-50 p-2 rounded text-center">
                               <span className="block text-stone-500 uppercase text-[10px] mb-0.5">面積</span>
                               <span className="font-mono font-semibold text-orange-700 text-sm">{record.area}</span>
                             </div>
                             <div className={`p-2 rounded text-center ${Math.abs(record.perimeter - 30) <= 2 ? 'bg-emerald-50' : 'bg-orange-50'}`}>
                               <span className="block text-stone-500 uppercase text-[10px] mb-0.5">周長</span>
                               <span className={`font-mono font-semibold text-sm ${Math.abs(record.perimeter - 30) <= 2 ? 'text-emerald-700' : 'text-orange-700'}`}>{record.perimeter}</span>
                             </div>
                           </div>
                         </div>
                       ))}
                     </div>
                   )}
                 </div>
               )}
            </div>
          </main>

          {showReasoning && (
            <div className="absolute inset-0 bg-stone-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-8 animate-in fade-in zoom-in duration-200">
                <h2 className="text-2xl font-bold text-stone-800 mb-2">推理診斷</h2>
                <p className="text-lg text-stone-600 mb-8">
                  綜合比較這三個圖形，當周長都差不多時，哪一種形狀的<strong className="text-orange-600">『面積』</strong>會比較大？
                </p>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                  <button 
                    onClick={() => handleReasoningAnswer(false)}
                    className="p-5 border-2 border-stone-200 rounded-xl hover:border-orange-400 hover:bg-orange-50 transition-all text-left group"
                  >
                    <div className="font-bold text-stone-700 text-lg mb-1 group-hover:text-orange-700">越細長的形狀</div>
                    <div className="text-stone-500 text-sm">長寬差異很大的圖形</div>
                  </button>
                  <button 
                    onClick={() => handleReasoningAnswer(true)}
                    className="p-5 border-2 border-stone-200 rounded-xl hover:border-emerald-400 hover:bg-emerald-50 transition-all text-left group"
                  >
                    <div className="font-bold text-stone-700 text-lg mb-1 group-hover:text-emerald-700">越接近正方形的形狀</div>
                    <div className="text-stone-500 text-sm">長寬差異很小的圖形</div>
                  </button>
                </div>
                
                {reasoningFeedback && (
                  <div className={`p-4 rounded-xl mb-8 flex items-start gap-3 ${reasoningFeedback.isCorrect ? "bg-emerald-50 text-emerald-800 border border-emerald-200" : "bg-orange-50 text-orange-800 border border-orange-200"}`}>
                    {reasoningFeedback.isCorrect ? <CheckCircle2 className="shrink-0 mt-0.5 text-emerald-600" /> : <XCircle className="shrink-0 mt-0.5 text-orange-600" />}
                    <div className="font-medium">{reasoningFeedback.text}</div>
                  </div>
                )}
                
                <div className="flex justify-end gap-3 pt-4 border-t border-stone-100">
                  <button 
                    onClick={() => {
                      setShowReasoning(false);
                    }}
                    className="px-6 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold rounded-lg transition-colors"
                  >
                    返回觀察
                  </button>
                  {reasoningFeedback?.isCorrect && (
                    <button 
                      onClick={() => {
                        setHistory([]);
                        setShowReasoning(false);
                        setReasoningFeedback(null);
                      }}
                      className="px-6 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-lg transition-colors shadow-sm"
                    >
                      重新開始新任務
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
