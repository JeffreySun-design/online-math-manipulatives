<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小小測量家 - 重量學習</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel Standalone (for JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap');
      body {
        font-family: 'Zen Maru Gothic', sans-serif;
        /* Prevent pull-to-refresh on mobile */
        overscroll-behavior-y: none;
      }
      /* Custom scrollbar for item container */
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-amber-50 h-screen w-screen overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useEffect, useCallback } = React;

      // --- ICONS (Inline replacements for lucide-react) ---
      const Trash2 = ({ size = 24, className = "" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M3 6h18" />
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
          <line x1="10" y1="11" x2="10" y2="17" />
          <line x1="14" y1="11" x2="14" y2="17" />
        </svg>
      );

      const ScaleIcon = ({ size = 24, className = "" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/>
            <path d="M7 21h10"/>
            <path d="M12 3v18"/>
            <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
        </svg>
      );

      const RotateCcw = ({ size = 24, className = "" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      );

      const RefreshCcw = ({ size = 24, className = "" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
      );

      const Eye = ({ size = 24, className = "" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      );

      const EyeOff = ({ size = 24, className = "" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
          <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
          <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
          <line x1="2" y1="2" x2="22" y2="22" />
        </svg>
      );

      // --- CONSTANTS & TYPES ---
      const AppMode = {
        BALANCE: 'BALANCE',
        SCALE: 'SCALE',
      };

      const ItemType = {
        APPLE: 'APPLE',
        BOOK: 'BOOK',
        ERASER: 'ERASER',
        WEIGHT_10: 'WEIGHT_10',
        WEIGHT_100: 'WEIGHT_100',
        WEIGHT_1000: 'WEIGHT_1000',
      };

      const WEIGHT_ITEMS = {
        [ItemType.APPLE]: {
          type: ItemType.APPLE,
          name: '蘋果',
          weight: 200,
          visualScale: 1.1,
        },
        [ItemType.BOOK]: {
          type: ItemType.BOOK,
          name: '書本',
          weight: 500,
          visualScale: 1.3,
        },
        [ItemType.ERASER]: {
          type: ItemType.ERASER,
          name: '橡皮擦',
          weight: 20,
          visualScale: 0.9,
        },
        [ItemType.WEIGHT_10]: {
          type: ItemType.WEIGHT_10,
          name: '10克',
          weight: 10,
          visualScale: 0.7, // Very small
        },
        [ItemType.WEIGHT_100]: {
          type: ItemType.WEIGHT_100,
          name: '100克',
          weight: 100,
          visualScale: 1.0,
        },
        [ItemType.WEIGHT_1000]: {
          type: ItemType.WEIGHT_1000,
          name: '1公斤',
          weight: 1000,
          visualScale: 1.6, // Very large
        },
      };

      const getItemIcon = (type) => {
          switch (type) {
              case ItemType.APPLE: 
                  return <div className="text-4xl drop-shadow-md filter transition-transform hover:scale-110">🍎</div>;
              case ItemType.BOOK: 
                  return <div className="text-4xl drop-shadow-md filter transition-transform hover:scale-110">📚</div>;
              case ItemType.ERASER: 
                  return (
                      <div className="w-8 h-5 bg-white border border-slate-300 rounded-sm skew-x-12 shadow-md relative overflow-hidden">
                           <div className="absolute left-0 top-0 bottom-0 w-3 bg-blue-400"></div>
                      </div>
                  );
              case ItemType.WEIGHT_10: 
                  return (
                      <svg width="32" height="32" viewBox="0 0 24 24" className="drop-shadow-sm">
                          <path d="M12 2l10 6v8l-10 6-10-6V8z" fill="#cbd5e1" stroke="#94a3b8" strokeWidth="1"/>
                          <text x="12" y="15" fontSize="8" textAnchor="middle" fill="#64748b" fontWeight="bold">10</text>
                      </svg>
                  );
              case ItemType.WEIGHT_100: 
                  return (
                      <div className="relative w-10 h-10">
                          <div className="absolute inset-0 bg-slate-400 rounded-full shadow-inner border border-slate-500"></div>
                          <div className="absolute top-1 left-1/2 -translate-x-1/2 w-4 h-2 bg-slate-300 rounded-full"></div>
                          <div className="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white drop-shadow-md pt-1">100g</div>
                      </div>
                  );
              case ItemType.WEIGHT_1000: 
                  return (
                      <div className="relative w-16 h-14 bg-slate-600 rounded-lg shadow-xl border-b-4 border-slate-800 flex flex-col items-center justify-center">
                           <div className="absolute -top-3 w-8 h-4 bg-slate-500 rounded-t-lg border border-slate-600"></div>
                           <span className="text-white font-black text-sm tracking-wider">1KG</span>
                      </div>
                  );
              default: return null;
          }
      }

      // --- COMPONENTS ---

      // DraggableItem
      const DraggableItem = ({ item, source = 'inventory', id }) => {
        const handleDragStart = (e) => {
          // Construct data payload
          const data = {
            type: item.type,
            id: id,
            source: source
          };
          
          e.dataTransfer.setData('text/plain', JSON.stringify(data));
          e.dataTransfer.effectAllowed = source === 'inventory' ? 'copy' : 'move';
        };

        const isInventory = source === 'inventory';
        const scale = isInventory ? Math.min(item.visualScale, 1.2) : item.visualScale;

        return (
          <div
            draggable
            onDragStart={handleDragStart}
            className={`
              relative flex flex-col items-center justify-end
              cursor-grab active:cursor-grabbing transition-transform hover:scale-105 select-none
              ${isInventory ? 'mx-3 mb-1' : 'm-0 -mb-1'} 
            `}
            style={{
                width: isInventory ? '80px' : 'auto',
                height: isInventory ? '100px' : 'auto',
                zIndex: isInventory ? 10 : 20
            }}
            title={item.name}
          >
            <div 
              style={{ transform: `scale(${scale})` }} 
              className="flex items-center justify-center origin-bottom transition-transform duration-200"
            >
              {getItemIcon(item.type)}
            </div>
            
            <div className={`mt-2 text-center leading-tight ${isInventory ? 'opacity-100' : 'opacity-0 hover:opacity-100 absolute -bottom-10 bg-white/90 px-2 py-1 rounded shadow-sm z-50 pointer-events-none transition-opacity'}`}>
              <span className="text-slate-700 font-bold text-lg">
                {item.name}
              </span>
            </div>
          </div>
        );
      };

      // BalanceMode
      const BalanceMode = ({
        leftItems,
        rightItems,
        onDropItem,
        onRemoveItem,
        onMoveItem,
      }) => {
        const leftTotal = useMemo(() => leftItems.reduce((acc, i) => acc + i.weight, 0), [leftItems]);
        const rightTotal = useMemo(() => rightItems.reduce((acc, i) => acc + i.weight, 0), [rightItems]);
        const [dragSide, setDragSide] = useState(null);
        const [isTrashHover, setIsTrashHover] = useState(false);

        // Physics Logic for rotation
        let rotation = 0;
        if (leftTotal > rightTotal) rotation = -15;
        else if (rightTotal > leftTotal) rotation = 15;

        const handleDragOver = (side) => (e) => {
          e.preventDefault(); 
          e.dataTransfer.dropEffect = 'copy';
          if (dragSide !== side) setDragSide(side);
        };

        const handleDragLeave = (e) => {
          setDragSide(null);
        }

        const handleDrop = (side) => (e) => {
          e.preventDefault();
          e.stopPropagation(); 
          setDragSide(null);

          const dataString = e.dataTransfer.getData('text/plain');
          if (dataString) {
            try {
              const data = JSON.parse(dataString);
              
              if (data.source === 'inventory') {
                  onDropItem(side, data.type);
              } 
              else if (data.source === 'left' || data.source === 'right') {
                  if (data.source !== side && data.id) {
                      onMoveItem(data.source, side, data.id);
                  }
              }
            } catch (err) {
              console.error("Drop failed", err);
            }
          }
        };

        const handleBackgroundDrop = (e) => {
            e.preventDefault();
            setDragSide(null);
            setIsTrashHover(false);
            const dataString = e.dataTransfer.getData('text/plain');
            if (dataString) {
                try {
                    const data = JSON.parse(dataString);
                    if (data.source === 'left' || data.source === 'right') {
                        if (data.id) onRemoveItem(data.source, data.id);
                    }
                } catch (e) {}
            }
        };

        const allowDrop = (e) => {
          e.preventDefault();
          setIsTrashHover(false);
        }
        
        const handleTrashDragOver = (e) => {
            e.preventDefault();
            e.stopPropagation();
            setIsTrashHover(true);
            e.dataTransfer.dropEffect = 'move';
        }

        return (
          <div 
              className="flex-1 flex flex-col items-center justify-end relative w-full h-full min-h-[600px] overflow-hidden"
              onDrop={handleBackgroundDrop}
              onDragOver={allowDrop}
          >
            
            {/* Trash Can */}
            <div 
              className={`
                  absolute bottom-6 right-6 w-20 h-20 rounded-full 
                  flex flex-col items-center justify-center 
                  border-4 transition-all duration-300 z-50
                  ${isTrashHover 
                      ? 'bg-rose-200 border-rose-500 scale-110 shadow-lg' 
                      : 'bg-white/80 border-slate-300 text-slate-400 hover:border-rose-300 hover:text-rose-400'
                  }
              `}
              onDragOver={handleTrashDragOver}
              onDragLeave={() => setIsTrashHover(false)}
              onDrop={handleBackgroundDrop}
            >
                <Trash2 size={32} className={isTrashHover ? 'text-rose-600' : ''} />
                <span className="text-[10px] font-bold mt-1">移除</span>
            </div>

            {/* Large Invisible Drop Zones */}
            <div 
              className="absolute top-20 bottom-20 left-4 w-[40%] z-40 cursor-default"
              onDragOver={handleDragOver('left')}
              onDragLeave={handleDragLeave}
              onDrop={handleDrop('left')}
            ></div>
            <div 
              className="absolute top-20 bottom-20 right-4 w-[40%] z-40 cursor-default"
              onDragOver={handleDragOver('right')}
              onDragLeave={handleDragLeave}
              onDrop={handleDrop('right')}
            ></div>

            {/* Main Scale Assembly */}
            <div className="relative w-full max-w-6xl h-[600px] mx-auto flex justify-center text-slate-700 pointer-events-none">
              
              <div className="absolute bottom-0 w-96 h-10 bg-slate-800 rounded-full z-10 shadow-2xl"></div>

              <div className="absolute bottom-8 left-1/2 -translate-x-1/2 w-16 h-96 bg-gradient-to-b from-slate-600 to-slate-800 rounded-t-2xl z-10 shadow-lg border-x border-slate-600"></div>

              {/* Pivot */}
              <div className="absolute bottom-[380px] left-1/2 w-0 h-0 z-20">
                  
                  <div 
                      className="relative flex justify-center items-center transition-transform duration-1000 ease-[cubic-bezier(0.34,1.56,0.64,1)] origin-center"
                      style={{ transform: `rotate(${rotation}deg)` }}
                  >
                      {/* Beam */}
                      <div className="absolute w-[800px] h-10 bg-gradient-to-b from-orange-300 to-orange-500 rounded-full shadow-lg border border-orange-600 flex items-center justify-between px-4">
                          <div className="w-4 h-4 rounded-full bg-orange-700/30"></div>
                          <div className="w-4 h-4 rounded-full bg-orange-700/30"></div>
                          <div className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-slate-700 shadow-inner z-30"></div>
                          <div className="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-slate-700 shadow-inner z-30"></div>
                      </div>

                      {/* Left Pan */}
                      <div className="absolute left-[-380px] top-0 w-0 h-0">
                          <div 
                              className="relative flex flex-col items-center transition-transform duration-1000 ease-[cubic-bezier(0.34,1.56,0.64,1)] origin-top"
                              style={{ transform: `rotate(${-rotation}deg)` }}
                          >
                              <svg width="280" height="230" className="absolute top-0 left-1/2 -translate-x-1/2 -mt-1 pointer-events-none opacity-60">
                                  <line x1="140" y1="0" x2="20" y2="230" stroke="#94a3b8" strokeWidth="2" />
                                  <line x1="140" y1="0" x2="260" y2="230" stroke="#94a3b8" strokeWidth="2" />
                              </svg>
                              
                              <div className="h-56"></div>
                              
                              <div 
                                  onDragOver={handleDragOver('left')}
                                  onDrop={handleDrop('left')}
                                  className={`
                                      w-72 h-16 -mt-1
                                      bg-gradient-to-b from-slate-100 to-slate-300
                                      border-b-4 border-slate-400 rounded-2xl
                                      shadow-xl flex items-end justify-center px-2 pb-1
                                      relative z-50 transition-shadow duration-200
                                      ${dragSide === 'left' ? 'ring-4 ring-yellow-300 shadow-[0_0_20px_rgba(253,224,71,0.6)]' : ''}
                                  `}
                              >
                                  <div className="flex items-end justify-center flex-wrap gap-1 w-full relative -top-2 pointer-events-auto">
                                      {leftItems.map((item) => (
                                          <DraggableItem 
                                              key={item.id} 
                                              item={item} 
                                              id={item.id}
                                              source="left"
                                          />
                                      ))}
                                  </div>
                                  
                                  {leftItems.length === 0 && (
                                      <div className="absolute bottom-4 text-slate-400/50 font-bold text-lg select-none pointer-events-none">左盤</div>
                                  )}
                              </div>
                          </div>
                      </div>

                      {/* Right Pan */}
                      <div className="absolute left-[380px] top-0 w-0 h-0">
                          <div 
                              className="relative flex flex-col items-center transition-transform duration-1000 ease-[cubic-bezier(0.34,1.56,0.64,1)] origin-top"
                              style={{ transform: `rotate(${-rotation}deg)` }}
                          >
                              <svg width="280" height="230" className="absolute top-0 left-1/2 -translate-x-1/2 -mt-1 pointer-events-none opacity-60">
                                  <line x1="140" y1="0" x2="20" y2="230" stroke="#94a3b8" strokeWidth="2" />
                                  <line x1="140" y1="0" x2="260" y2="230" stroke="#94a3b8" strokeWidth="2" />
                              </svg>
                              
                              <div className="h-56"></div>
                              
                              <div 
                                  onDragOver={handleDragOver('right')}
                                  onDrop={handleDrop('right')}
                                  className={`
                                      w-72 h-16 -mt-1
                                      bg-gradient-to-b from-slate-100 to-slate-300
                                      border-b-4 border-slate-400 rounded-2xl
                                      shadow-xl flex items-end justify-center px-2 pb-1
                                      relative z-50 transition-shadow duration-200
                                      ${dragSide === 'right' ? 'ring-4 ring-yellow-300 shadow-[0_0_20px_rgba(253,224,71,0.6)]' : ''}
                                  `}
                              >
                                  <div className="flex items-end justify-center flex-wrap gap-1 w-full relative -top-2 pointer-events-auto">
                                      {rightItems.map((item) => (
                                          <DraggableItem 
                                              key={item.id} 
                                              item={item}
                                              id={item.id}
                                              source="right"
                                          />
                                      ))}
                                  </div>

                                  {rightItems.length === 0 && (
                                      <div className="absolute bottom-4 text-slate-400/50 font-bold text-lg select-none pointer-events-none">右盤</div>
                                  )}
                              </div>
                          </div>
                      </div>

                  </div>
              </div>

              {/* Pin */}
              <div className="absolute bottom-[380px] left-1/2 -translate-x-1/2 translate-y-1/2 w-14 h-14 bg-gradient-to-br from-slate-200 to-slate-400 rounded-full z-30 border-4 border-slate-500 shadow-lg flex items-center justify-center">
                  <div className="w-6 h-6 bg-slate-500 rounded-full shadow-inner opacity-50"></div>
              </div>

            </div>
          </div>
        );
      };

      // ScaleMode
      const CAPACITIES = [
        { label: '500 公克 (g)', value: 500 },
        { label: '1 公斤 (kg)', value: 1000 },
        { label: '3 公斤 (kg)', value: 3000 },
      ];

      const ScaleMode = ({ items, onDropItem, onRemoveItem, onClearAll }) => {
        const [capacity, setCapacity] = useState(1000);
        const [showAnswer, setShowAnswer] = useState(false);
        const [isTrashHover, setIsTrashHover] = useState(false);

        const totalWeight = useMemo(() => items.reduce((acc, i) => acc + i.weight, 0), [items]);

        const rotation = Math.min((totalWeight / capacity) * 360, 360); 
        
        const depression = Math.min((totalWeight / capacity) * 40, 40);

        const handleDragOver = (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'copy';
        };

        const handleDrop = (e) => {
          e.preventDefault();
          e.stopPropagation(); 
          const dataString = e.dataTransfer.getData('text/plain');
          if (dataString) {
            try {
              const data = JSON.parse(dataString);
              if (data.source === 'inventory') {
                  onDropItem(data.type);
              }
            } catch (e) {}
          }
        };

        const handleBackgroundDrop = (e) => {
            e.preventDefault();
            setIsTrashHover(false);
            const dataString = e.dataTransfer.getData('text/plain');
            if (dataString) {
              try {
                  const data = JSON.parse(dataString);
                  if (data.source === 'scale' && data.id) {
                      onRemoveItem(data.id);
                  }
              } catch (e) {}
            }
        };
        
        const allowDrop = (e) => {
          e.preventDefault();
          setIsTrashHover(false);
        }

        const handleTrashDragOver = (e) => {
            e.preventDefault();
            e.stopPropagation();
            setIsTrashHover(true);
            e.dataTransfer.dropEffect = 'move';
        }

        return (
          <div 
              className="flex-1 flex flex-col items-center justify-center w-full max-w-4xl mx-auto px-4 gap-4 relative"
              onDrop={handleBackgroundDrop}
              onDragOver={allowDrop}
          >
            
            {/* Trash Can */}
            <div 
              className={`
                  absolute bottom-6 right-0 w-20 h-20 rounded-full 
                  flex flex-col items-center justify-center 
                  border-4 transition-all duration-300 z-50
                  ${isTrashHover 
                      ? 'bg-rose-200 border-rose-500 scale-110 shadow-lg' 
                      : 'bg-white/80 border-slate-300 text-slate-400 hover:border-rose-300 hover:text-rose-400'
                  }
              `}
              onDragOver={handleTrashDragOver}
              onDragLeave={() => setIsTrashHover(false)}
              onDrop={handleBackgroundDrop}
            >
                <Trash2 size={32} className={isTrashHover ? 'text-rose-600' : ''} />
                <span className="text-[10px] font-bold mt-1">移除</span>
            </div>

            {/* Controls */}
            <div className="flex items-center gap-4 bg-white/80 p-3 rounded-2xl shadow-sm backdrop-blur-sm z-50">
              <div className="flex items-center gap-2">
                  <span className="text-slate-600 font-bold text-sm whitespace-nowrap">最大秤重:</span>
                  <select 
                      value={capacity} 
                      onChange={(e) => setCapacity(Number(e.target.value))}
                      className="bg-white border border-slate-300 rounded-md py-1 px-3 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm cursor-pointer"
                  >
                      {CAPACITIES.map(c => (
                          <option key={c.value} value={c.value}>{c.label}</option>
                      ))}
                  </select>
              </div>

              <button 
                  onClick={onClearAll}
                  className="flex items-center gap-1 px-3 py-1 rounded-full text-sm font-bold transition-colors bg-rose-100 text-rose-600 hover:bg-rose-200 hover:scale-105 active:scale-95"
                  title="清空磅秤"
              >
                  <Trash2 size={16} />
                  <span>清空</span>
              </button>

              <div className="h-6 w-px bg-slate-300"></div>
              <button 
                  onClick={() => setShowAnswer(!showAnswer)}
                  className={`flex items-center gap-2 px-3 py-1 rounded-full text-sm font-bold transition-colors ${showAnswer ? 'bg-blue-500 text-white' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`}
                  title="顯示/隱藏數值"
              >
                  {showAnswer ? <Eye size={16}/> : <EyeOff size={16} />}
                  <span>數值</span>
              </button>
            </div>

            {/* Scale Visual */}
            <div className="relative flex flex-col items-center mt-40">
              
              {/* The Plate + Hit Zone */}
              <div 
                  onDragOver={handleDragOver}
                  onDrop={handleDrop}
                  className="w-80 h-[600px] absolute bottom-full left-1/2 -translate-x-1/2 z-40 bg-transparent flex flex-col justify-end items-center transition-transform duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)]"
                  style={{ transform: `translateX(-50%) translateY(${depression}px)` }}
              >
                  {/* Visual Plate */}
                  <div className="
                      w-64 h-16 
                      bg-gradient-to-b from-slate-100 to-slate-300 
                      border-b-4 border-slate-400 rounded-xl shadow-lg
                      flex flex-col justify-end items-center
                      transition-transform active:scale-[0.99]
                  ">
                      {/* Items */}
                      <div className="absolute bottom-16 w-full flex flex-wrap justify-center items-end gap-1 pb-1">
                          {items.map((item) => (
                              <DraggableItem 
                                  key={item.id} 
                                  item={item} 
                                  id={item.id}
                                  source="scale"
                              />
                          ))}
                      </div>
                      {items.length === 0 && <div className="text-slate-400/50 font-bold text-xs mb-2 pointer-events-none">放東西上來</div>}
                  </div>
              </div>

              {/* Stem */}
              <div 
                  className="w-6 h-12 bg-gradient-to-r from-slate-400 to-slate-300 z-10 -mt-1 transition-transform duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)]"
                  style={{ transform: `translateY(${depression}px)` }}
              ></div>

              {/* Dial Body */}
              <div className="relative w-64 h-64 bg-white rounded-full border-[12px] border-slate-200 shadow-xl flex items-center justify-center z-10">
                  
                  <div className="absolute w-[90%] h-[90%] rounded-full border border-slate-100"></div>

                  {/* Ticks */}
                  {[...Array(12)].map((_, i) => (
                      <div 
                          key={i} 
                          className="absolute w-1 h-full flex flex-col justify-between py-2"
                          style={{ transform: `rotate(${i * 30}deg)` }}
                      >
                          <div className="w-1 h-3 bg-slate-400"></div>
                      </div>
                  ))}

                  <div className="absolute top-4 text-[10px] font-bold text-slate-400">0</div>
                  <div className="absolute right-4 text-[10px] font-bold text-slate-400">{capacity * 0.25}g</div>
                  <div className="absolute bottom-4 text-[10px] font-bold text-slate-400">{capacity * 0.5}g</div>
                  <div className="absolute left-4 text-[10px] font-bold text-slate-400">{capacity * 0.75}g</div>

                  {/* Digital Display */}
                  <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 mt-12 w-28 h-10 bg-slate-100 rounded border-2 border-slate-300 shadow-inner flex items-center justify-center overflow-hidden">
                      {showAnswer ? (
                          <div className="text-xl font-black text-slate-700 font-mono tracking-wider">{totalWeight} <span className="text-xs text-slate-500">g</span></div>
                      ) : (
                          <div className="text-xl font-bold text-slate-300 tracking-widest">???</div>
                      )}
                  </div>

                  {/* Needle */}
                  <div 
                      className="absolute top-0 left-0 w-full h-full transition-transform duration-1000 ease-out z-10 pointer-events-none"
                      style={{ transform: `rotate(${rotation}deg)` }}
                  >
                      <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-full w-2 h-[42%] bg-rose-500 rounded-full shadow-sm">
                          <div className="absolute -top-2 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-b-[12px] border-b-rose-500"></div>
                      </div>
                  </div>

                  <div className="absolute w-5 h-5 bg-slate-600 rounded-full border-2 border-slate-300 z-20 shadow-md"></div>
              </div>

              <div className="w-56 h-6 bg-slate-800 rounded-full mt-[-8px] z-0 shadow-2xl"></div>

            </div>

          </div>
        );
      };

      // --- MAIN APP ---
      const App = () => {
        const [mode, setMode] = useState(AppMode.BALANCE);
        
        // Balance State
        const [leftItems, setLeftItems] = useState([]);
        const [rightItems, setRightItems] = useState([]);
        
        // Scale State
        const [scaleItems, setScaleItems] = useState([]);

        const playSound = (type) => {
          // Placeholder
        };

        const generateItem = (type) => {
          const itemDef = WEIGHT_ITEMS[type];
          return {
            ...itemDef,
            id: `${type}-${Date.now()}-${Math.random()}`, 
          };
        };

        const handleDropBalance = (side, type) => {
          playSound('drop');
          const newItem = generateItem(type);
          if (side === 'left') {
            setLeftItems(prev => [...prev, newItem]);
          } else {
            setRightItems(prev => [...prev, newItem]);
          }
        };

        const handleMoveBalance = (fromSide, toSide, itemId) => {
            const sourceList = fromSide === 'left' ? leftItems : rightItems;
            const itemToMove = sourceList.find(i => i.id === itemId);
            
            if (!itemToMove) return;

            if (fromSide === 'left') {
                setLeftItems(prev => prev.filter(i => i.id !== itemId));
            } else {
                setRightItems(prev => prev.filter(i => i.id !== itemId));
            }

            if (toSide === 'left') {
                setLeftItems(prev => [...prev, itemToMove]);
            } else {
                setRightItems(prev => [...prev, itemToMove]);
            }
            playSound('drop');
        };

        const handleDropScale = (type) => {
          playSound('drop');
          const newItem = generateItem(type);
          setScaleItems(prev => [...prev, newItem]);
        };

        const handleRemoveBalance = (side, id) => {
          playSound('reset'); 
          if (side === 'left') {
            setLeftItems(prev => prev.filter(i => i.id !== id));
          } else {
            setRightItems(prev => prev.filter(i => i.id !== id));
          }
        };

        const handleRemoveScale = (id) => {
          playSound('reset');
          setScaleItems(prev => prev.filter(i => i.id !== id));
        };

        const handleReset = () => {
          playSound('reset');
          if (mode === AppMode.BALANCE) {
            setLeftItems([]);
            setRightItems([]);
          } else {
            setScaleItems([]);
          }
        };

        const handleFooterDrop = (e) => {
          e.preventDefault();
          const dataString = e.dataTransfer.getData('text/plain');
          if (dataString) {
              try {
                  const data = JSON.parse(dataString);
                  if (data.id && data.source !== 'inventory') {
                      if (data.source === 'left') handleRemoveBalance('left', data.id);
                      else if (data.source === 'right') handleRemoveBalance('right', data.id);
                      else if (data.source === 'scale') handleRemoveScale(data.id);
                  }
              } catch (err) {}
          }
        };

        const allowDrop = (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        };

        return (
          <div className="flex flex-col h-full bg-gradient-to-b from-amber-50 to-orange-50">
            
            {/* Header */}
            <header className="flex-none p-4 flex items-center justify-between bg-white shadow-md z-30">
              <div className="flex items-center gap-2">
                  <div className="p-2 bg-orange-100 rounded-lg text-orange-600">
                      <ScaleIcon size={24} />
                  </div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-700 tracking-wider">
                      小小測量家
                  </h1>
              </div>

              {/* Mode Switcher */}
              <div className="flex bg-slate-100 p-1 rounded-full border border-slate-200">
                <button
                  onClick={() => setMode(AppMode.BALANCE)}
                  className={`px-4 py-2 rounded-full font-bold text-sm transition-all duration-300 ${
                    mode === AppMode.BALANCE 
                    ? 'bg-orange-400 text-white shadow-sm' 
                    : 'text-slate-500 hover:text-slate-700'
                  }`}
                >
                  天平模式
                </button>
                <button
                  onClick={() => setMode(AppMode.SCALE)}
                  className={`px-4 py-2 rounded-full font-bold text-sm transition-all duration-300 ${
                    mode === AppMode.SCALE 
                    ? 'bg-cyan-500 text-white shadow-sm' 
                    : 'text-slate-500 hover:text-slate-700'
                  }`}
                >
                  磅秤模式
                </button>
              </div>

              {/* Reset Button */}
              <button 
                onClick={handleReset}
                className="flex items-center gap-2 bg-rose-100 text-rose-600 hover:bg-rose-200 px-4 py-2 rounded-xl font-bold transition-colors active:scale-95"
              >
                <RefreshCcw size={18} />
                <span className="hidden sm:inline">重置</span>
              </button>
            </header>

            {/* Workspace */}
            <main className="flex-1 relative overflow-hidden flex flex-col">
              {mode === AppMode.BALANCE ? (
                <BalanceMode 
                  leftItems={leftItems} 
                  rightItems={rightItems}
                  onDropItem={handleDropBalance}
                  onRemoveItem={handleRemoveBalance}
                  onMoveItem={handleMoveBalance}
                />
              ) : (
                <ScaleMode 
                  items={scaleItems}
                  onDropItem={handleDropScale}
                  onRemoveItem={handleRemoveScale}
                  onClearAll={() => {
                      playSound('reset');
                      setScaleItems([]);
                  }}
                />
              )}
            </main>

            {/* Footer */}
            <footer 
              className="flex-none bg-white border-t-4 border-orange-200 p-2 z-30 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] transition-colors"
              onDrop={handleFooterDrop}
              onDragOver={allowDrop}
            >
              <div className="text-center text-xs font-bold text-slate-400 mb-1">物品欄 (拖曳物品到上方 / 拖回此處刪除)</div>
              <div className="flex items-center justify-center gap-2 md:gap-6 overflow-x-auto hide-scrollbar pb-2">
                  {Object.values(WEIGHT_ITEMS).map((item) => (
                      <DraggableItem key={item.type} item={item} source="inventory" />
                  ))}
              </div>
            </footer>

          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
